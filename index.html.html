<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>타워 서바이버</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0d0b16;
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:#e8e4ff;touch-action:none;user-select:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas{display:block;touch-action:none}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 8px)}
.top{display:flex;gap:5px;align-items:center;justify-content:flex-end;flex-wrap:nowrap}
.chip{background:rgba(22,18,38,.78);border:1px solid rgba(140,120,220,.28);border-radius:8px;
  padding:5px 9px;font-size:11px;font-weight:800;letter-spacing:.08em;color:#cfc6ff;backdrop-filter:blur(6px)}
.chip.btn{pointer-events:auto;margin-left:auto;font-size:14px;padding:4px 11px}
#timeChip{min-width:62px;text-align:center;padding:4px 8px}
#pauseBtn{margin-left:0;width:42px;padding:3px 8px}
.bar{position:relative;height:16px;margin-top:6px;border-radius:5px;overflow:hidden;
  background:rgba(12,9,24,.8);border:1px solid rgba(140,120,220,.24)}
.bar i{position:absolute;inset:0;width:0%;display:block;border-radius:4px;transition:width .12s linear}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:800;letter-spacing:.09em;text-shadow:0 1px 2px rgba(0,0,0,.9)}
.tower i{background:linear-gradient(90deg,#ffb347,#ffd98a)}
.hp i{background:linear-gradient(90deg,#ff5d73,#ff97a8)}
.xp i{background:linear-gradient(90deg,#5ff0c0,#9dffe0);transition:width .2s}
.gauge{height:22px;border-color:rgba(255,210,120,.4)}
.gauge i{background:linear-gradient(90deg,#7b5bff,#c58bff);transition:none}
.gauge.full i{background:linear-gradient(90deg,#ffb020,#ffe89a)}
.gauge.full{box-shadow:0 0 14px rgba(255,180,60,.5)}
.gauge span{font-size:9.5px}
#gauges{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.botbar{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px)}
.slot{display:flex;align-items:center;gap:4px;background:rgba(22,18,38,.7);border:1px solid rgba(140,120,220,.22);
  border-radius:7px;padding:3px 6px;font-size:10px;font-weight:700;white-space:nowrap}
.slot b{font-size:9px;opacity:.65}
#mmWrap{margin-top:5px;width:92px;position:relative}
#mm{width:92px;height:92px;border-radius:8px;border:1px solid rgba(140,120,220,.3);background:rgba(9,7,18,.5);display:block}
#itemSlot{position:absolute;left:10px;bottom:calc(var(--xpbar-h, 26px) + 14px);
  width:54px;height:54px;border-radius:12px;
  background:rgba(14,18,32,.82);border:2px solid #ff5a3c;
  box-shadow:0 0 12px rgba(255,90,60,.45);
  display:none;align-items:center;justify-content:center;cursor:pointer;
  z-index:20;
  pointer-events:auto;-webkit-tap-highlight-color:transparent}
#itemSlot.on{display:flex}
#itemSlot:active{transform:scale(.94)}
#itemIcon{font-size:26px;line-height:1}
#itemCount{position:absolute;right:4px;bottom:2px;font-size:12px;font-weight:900;color:#ffd166}
#teamToggle{margin-top:4px;width:120px;font-size:8.5px;padding:2px 5px}
#teamList{margin-top:3px;width:120px;display:flex;flex-direction:column;gap:2px}
#teamList.closed{display:none}
.tm-row{display:flex;align-items:center;gap:4px;background:rgba(18,14,32,.62);border-radius:5px;padding:2px 4px;font-size:8.5px;font-weight:700}
.tm-row.me{border:1px solid rgba(255,209,102,.55)}
.tm-row.down{opacity:.55}
.tm-name{width:29px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-bar{flex:1;height:5px;border-radius:3px;background:rgba(0,0,0,.55);overflow:hidden;position:relative}
.tm-bar i{display:block;height:100%;background:linear-gradient(90deg,#5ff0c0,#9dffe0)}
.tm-row.down .tm-bar i{background:#777}
.tm-down-t{font-size:7.5px;opacity:.8;flex-shrink:0}

/* ---------- Pause dashboard ---------- */
.pause-panel{max-width:520px}
.pause-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 8px}
.pause-summary div{background:rgba(24,20,44,.82);border:1px solid rgba(150,130,240,.24);border-radius:9px;padding:7px 4px}
.pause-summary b{display:block;font-size:14px;color:#d8ceff}
.pause-summary span{display:block;margin-top:2px;font-size:8px;color:#8176aa;letter-spacing:.1em}
.pause-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 10px;text-align:left}
.pause-box{height:min(31vh,230px);min-height:150px;overflow-y:auto;background:rgba(18,15,34,.76);border:1px solid rgba(150,130,240,.22);border-radius:11px;padding:9px}
.pause-box h3{font-size:11px;letter-spacing:.08em;color:#9dd6ff;margin-bottom:7px}
.pause-row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 0;border-bottom:1px solid rgba(150,130,240,.12);font-size:10px;line-height:1.35}
.pause-row:last-child{border-bottom:0}
.pause-row b{color:#eeeaff;text-align:right;font-size:9px;white-space:nowrap}
.pause-empty{font-size:10px;color:#6f649c;padding:5px 0}
@media (max-height:720px){
  .pause-summary{margin:7px 0 6px}
  .pause-box{height:150px;min-height:120px}
  .pause-panel .title{font-size:23px!important}
}

/* ---------- Screens ---------- */
#screens{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:#0d0b16;background-size:cover;background-position:center;
  backdrop-filter:blur(8px);pointer-events:auto;padding:18px;overflow-y:auto}
#screens.on{display:flex}
.panel{width:100%;max-width:460px;text-align:center}
.title{font-size:34px;font-weight:900;letter-spacing:-.02em;line-height:1.05;
  background:linear-gradient(180deg,#fff,#b39dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12.5px;color:#9b90c4;margin-top:8px;line-height:1.65}
.eyebrow{font-size:10px;letter-spacing:.32em;color:#7d6fb8;font-weight:800;margin-bottom:10px}
.modes{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.mode{pointer-events:auto;text-align:left;background:rgba(30,24,54,.9);border:1px solid rgba(150,130,240,.3);
  border-radius:14px;padding:14px 16px;cursor:pointer;transition:.15s;font-family:inherit;color:inherit;width:100%}
.mode:active{transform:scale(.985);border-color:#a98bff}
.mode.sel{border-color:#a98bff;background:rgba(90,60,170,.35)}
.mode h3{font-size:16px;font-weight:800;margin-bottom:4px}
.mode p{font-size:11.5px;color:#9b90c4;line-height:1.6}
.cards{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.card{pointer-events:auto;text-align:left;background:rgba(28,22,50,.94);border-radius:13px;padding:12px 14px;
  cursor:pointer;border:1px solid var(--c);position:relative;overflow:hidden;transition:.12s;font-family:inherit;color:inherit;width:100%}
.card:active{transform:scale(.985)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.card h4{font-size:14.5px;font-weight:800;color:var(--c);display:flex;align-items:center;gap:7px}
.card p{font-size:11.5px;color:#a79ccc;margin-top:4px;line-height:1.55}
.tag{margin-left:auto;font-size:9px;letter-spacing:.14em;opacity:.85;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}
.stat{background:rgba(30,24,54,.7);border-radius:10px;padding:10px}
.stat b{display:block;font-size:20px;font-weight:900;color:#c9b8ff}
.stat i{font-size:10px;font-style:normal;color:#8b80b4;letter-spacing:.1em}
.btnmain{pointer-events:auto;width:100%;margin-top:6px;background:linear-gradient(135deg,#7b5bff,#b06cff);
  border:0;border-radius:12px;padding:14px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.btnmain:active{transform:scale(.985)}
.btnmain:disabled{opacity:.4;pointer-events:none}
.btnghost{pointer-events:auto;width:100%;margin-top:8px;background:transparent;border:1px solid rgba(150,130,240,.3);
  border-radius:12px;padding:12px;color:#9b90c4;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.hint{font-size:10.5px;color:#6f649c;margin-top:14px;line-height:1.7}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.row4{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.charcard{pointer-events:auto;background:rgba(30,24,54,.9);border:2px solid rgba(150,130,240,.25);border-radius:14px;
  padding:14px 10px;cursor:pointer;font-family:inherit;color:inherit;text-align:center;transition:.12s}
.charcard.sel{border-color:#a98bff;background:rgba(90,60,170,.35)}
.charcard b{display:block;font-size:15px;margin-top:4px}
.charcard i{font-style:normal;font-size:10.5px;color:#9b90c4}
.sizes{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.sizebtn{pointer-events:auto;width:52px;height:52px;border-radius:50%;border:2px solid rgba(150,130,240,.3);
  background:rgba(30,24,54,.9);color:#e8e4ff;font-size:18px;font-weight:900;cursor:pointer}
.sizebtn.sel{border-color:#ffb020;background:rgba(255,176,32,.18);color:#ffd166}
.slide{margin-top:16px;text-align:left}
.slide label{font-size:11.5px;color:#a79ccc;display:flex;justify-content:space-between;margin-bottom:4px}
.slide input{width:100%;pointer-events:auto}
.petlist{display:flex;flex-direction:column;gap:8px;margin-top:14px;text-align:left}
.pgroup b{font-size:11px;letter-spacing:.1em;color:#7d6fb8}
.petrow{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;background:rgba(30,24,54,.85);
  border:1px solid rgba(150,130,240,.25);border-radius:10px;padding:8px 12px;margin-top:6px;cursor:pointer;font-size:12.5px}
.petrow.active{border-color:#5ff0c0;background:rgba(60,150,120,.22)}
.petrow span{opacity:.7;font-size:10.5px}
.steps{display:flex;gap:5px;justify-content:center;margin-bottom:14px}
.steps i{width:22px;height:4px;border-radius:2px;background:rgba(150,130,240,.25);font-style:normal}
.steps i.on{background:#a98bff}
#mainHome{position:absolute;inset:0;display:none;background:#050208;overflow:hidden}
#mainHome.on{display:block}
#mainImg{position:absolute;transition:transform .1s ease;pointer-events:none;user-select:none;-webkit-user-drag:none}
#mainImg.press{transform:scale(.98)}
.hitzone{position:absolute;background:transparent;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none;-webkit-appearance:none;appearance:none}
/* ===== 캐릭터 선택창 ===== */
#selWrap{position:absolute;inset:0;overflow:hidden}
#selBg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
#selWrap>*:not(#selBg){position:absolute}
#selChar{left:20.2%;top:6.2%;width:59.6%;height:51.1%;
  display:flex;align-items:center;justify-content:center}
#charGif{max-width:86%;max-height:86%;width:auto;height:auto;
  object-fit:contain;image-rendering:auto;display:block}
.selArrow{top:27.5%;width:13%;height:9.5%;
  background:none;border:0;padding:0;outline:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
#charPrev{left:3.5%}
#charNext{left:83.5%}
.selArrow:active{filter:brightness(1.6)}
#selWpn{left:16.7%;top:59.2%;width:65.7%;height:5.8%;
  display:flex;align-items:center;justify-content:space-between}
#wpnName{flex:1;text-align:center;font-weight:800;font-size:clamp(13px,3.6vw,20px);
  color:#dff4ff;text-shadow:0 0 8px rgba(120,220,255,.6)}
/* 화살표 아이콘은 배경 그림(선택창.png)에 이미 그려져 있으므로 틀·글자 없이 투명 히트존만 얹는다 */
.wArrow{background:none;border:0;padding:0;height:100%;width:16%;outline:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#selDesc{left:11.9%;top:67.1%;width:76.1%;height:13.7%;
  display:flex;flex-direction:column;justify-content:center;gap:2px;
  padding:0 5%;color:#dff4ff;text-align:center}
.dTop{display:flex;align-items:baseline;justify-content:center;gap:8px}
#cName{font-size:clamp(15px,4.4vw,24px);font-weight:900}
#cGender{font-size:clamp(10px,2.8vw,14px);opacity:.75}
#cTrait{font-size:clamp(11px,3.1vw,16px);color:#8fe9ff;font-weight:700}
#cDesc{font-size:clamp(10px,2.7vw,14px);opacity:.85;line-height:1.35}
#selStart{left:13.7%;top:84.3%;width:74.4%;height:6.7%;
  background:none;border:0;-webkit-tap-highlight-color:transparent;cursor:pointer}
#selStart:active{filter:brightness(1.15)}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="top">
      <div class="chip" id="timeChip">00:00</div>
      <button class="chip btn" id="pauseBtn">❚❚</button>
    </div>
    <div class="bar tower" id="towerBar"><i id="towerFill"></i><span id="towerTxt"></span></div>
    <div id="mmWrap"><canvas id="mm" width="112" height="112"></canvas></div>
    <button id="teamToggle" class="chip btn">▼ 팀</button>
    <div id="teamList"></div>
    <div id="itemSlot" class="slot"><span id="itemIcon">☢</span><b id="itemCount">1</b></div>
    <div class="botbar">
      <div class="bar xp" id="xpBar"><i id="xpFill"></i><span id="xpTxt"></span></div>
    </div>
  </div>
  <div id="screens"></div>
  <div id="mainHome"></div>
</div>

<script>
/* =====================================================================
   타워 서바이버 v2.1 — 생존 + 타워 디펜스 (실 에셋 / AI 팀전 / 버그수정)
   ===================================================================== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const app=document.getElementById('app'), screens=document.getElementById('screens');
const $=id=>document.getElementById(id);
/* 랙 원인 A/B 테스트용 디버그 스위치 — URL에 ?nomap=1 / ?nohud=1 붙이면 해당 기능을 끈다 (실기기에서 콘솔 없이도 테스트 가능) */
const _dbgParams=new URLSearchParams(location.search);
const DEBUG_NOMAP=_dbgParams.has('nomap');
const DEBUG_NOHUD=_dbgParams.has('nohud');
let W=0,H=0,DPR=1;
/* 핵폭탄 버튼을 경험치 바 바로 위에 붙인다 — 화면 바닥부터 XP바 윗변까지의 실제 거리를 잰다(안전영역·botbar 오프셋 포함) */
function syncXpBarVar(){
  const el=$('xpBar'); if(!el) return;
  const r=el.getBoundingClientRect();
  if(r.height<=0) return; // 아직 안 보이면(메뉴 화면 등) 건드리지 않고 기존 값 유지
  const h=Math.max(0,window.innerHeight-r.top);
  document.documentElement.style.setProperty('--xpbar-h',h+'px');
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1); // 캐릭터를 폰 기준 크기로 줄이고(prescale로 화질 확보) 그린 픽셀 수가 줄어든 만큼 상한을 다시 올림
  W=app.clientWidth; H=app.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high'; // 캔버스 크기 변경 시 초기화되므로 매번 다시 설정
  syncXpBarVar();
}
addEventListener('resize',resize); resize();

const WORLD=2400;
const WORLD_CENTER={x:WORLD/2,y:WORLD/2};
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const norm=a=>(a%TAU+TAU)%TAU;
const angDiff=(a,b)=>{const d=norm(a-b); return d>Math.PI?d-TAU:d;};
function turnTo(cur,tgt,rate,dt){
  const d=angDiff(tgt,cur), m=rate*dt;
  return cur+(d>m?m:d<-m?-m:d);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ================= 에셋 경로 ================= */
const P_SPR=n=>'assets/sprites/'+n+'.png';
const P_WPN=n=>'assets/weapons/'+n+'.png';
const P_FX =n=>'assets/fx/'+n+'.png';
const P_SND=n=>'assets/sounds/'+n+'.mp3';
const P_BG =n=>'assets/bg/'+n;
const P_CHR=n=>'assets/chars/'+n+'.png';
const P_GIF=n=>'assets/chars/'+n+'.gif';
const P_UI =n=>'assets/ui/'+n;

/* 이펙트 시트 메타 (셀 크기 / 프레임 수). cols/row 는 실제 이미지 크기로 런타임 계산 */
const FX_INFO={
  'sword_fx':{cell:[128,128],frames:14},
  'railgun_fx':{cell:[240,80],frames:13},
  'shotgun_fx':{cell:[200,140],frames:7},
  'shuriken':{cell:[97,96],frames:24},
  'bluesteel':{cell:[96,96],frames:24},
  'crimsonfang':{cell:[96,96],frames:18},
  'fireball_fx':{cell:[70,56],frames:20},
  'warn_sheet':{cell:[160,160],frames:8},
  'blood_slash_sheet':{cell:[192,192],frames:13},
  'blood_tornado_sheet':{cell:[192,192],frames:18},
};
/* 무기정보.json 인라인 — 손잡이(pivot, 0~1 가로비율) · 손잡이→총구 거리(muzzle, px, 원본 크기 기준) */
const WPN_INFO={
  'shotgun'  :{w:64,h:29,pivot:0.287,muzzle:45.6},
  'rifle':{w:72,h:24,pivot:0.315,muzzle:49.3},
  'machinegun':{w:66,h:24,pivot:0.379,muzzle:41.0},
  'railgun':{w:70,h:24,pivot:0.455,muzzle:38.1},
  'wolfgun':{w:34,h:23,pivot:0.209,muzzle:26.9},
  'revolver':{w:46,h:22,pivot:0.102,muzzle:41.3},
  'minigun':{w:100,h:27,pivot:0.268,muzzle:73.0}, // 라이플 렌더 폭(약33px)보다 살짝 큰 정도로 축소 (기존 132/.78이면 캐릭터 몸 2배로 너무 컸음)
};

/* ================= 무기 스프라이트 (실시간 회전, 손잡이 회전축, 총구 발사) ================= */
function loadImg(src){ const im=new Image(); im.ready=false; im.onload=()=>im.ready=true; im.onerror=()=>console.error('이미지 로드 실패:',src); im.src=src; return im; }
/* 미니건 새 이미지는 총구가 왼쪽(다른 총과 반대)이라, 로드 시 한 번만 좌우 반전해서 등록한다 */
function flipImgX(src){
  const c=document.createElement('canvas');
  c.width=src.width; c.height=src.height;
  const g=c.getContext('2d');
  g.translate(c.width,0); g.scale(-1,1);
  g.drawImage(src,0,0);
  return c;
}
const WPN_IMG={
  shotgun:loadImg(P_WPN('shotgun')), rifle:loadImg(P_WPN('rifle')), machinegun:loadImg(P_WPN('machinegun')),
  railgun:loadImg(P_WPN('railgun')), wolfgun:loadImg(P_WPN('wolfgun')), revolver:loadImg(P_WPN('revolver')),
  minigun:{ready:false},
};
(function(){
  const src=P_WPN('minigun'), im=new Image();
  im.onload=()=>{ const c=flipImgX(trimToCanvas(im)); c.ready=true; WPN_IMG.minigun=c; };
  im.onerror=()=>console.error('이미지 로드 실패:',src);
  im.src=src;
})();

const HAND_GUN    = { fwd:0.05, up:0.42 }; // 총: 몸 중앙에서 앞으로 아주 조금, 허리 높이

function handFwd(ang){ return Math.cos(ang)<0?-1:1; }

/* 투사체 공용 잔상 — 총알류(bullet/minigunBullet)와 이펙트 투사체(fxProj) 전부 재사용 */
function drawProjTrail(b,refSize){
  if(!b.trail) return;
  const base=ctx.globalAlpha; // 호출부에서 이미 걸어둔 수명 페이드 알파 — 잔상도 같이 곱해서 쓰고, 끝나면 그대로 복구한다
  const n=b.trailLen;
  for(let i=n-1;i>=0;i--){
    const idx=(b.trailHead-i+6)%6;
    const tp=b.trail[idx], ta=1-((i+1)/(n+1));
    ctx.globalAlpha=ta*0.3*base; ctx.fillStyle=b.c;
    ctx.beginPath(); ctx.arc(tp.x,tp.y,refSize*0.22*ta,0,7); ctx.fill();
  }
  ctx.globalAlpha=base;
}

/* ================= 배경 — 달 표면 바닥 + 오브젝트, 모든 모드 공통 =================
   바닥은 평균 밝기를 낮게(이펙트가 확실히 뜨게), 오브젝트는 실루엣+그림자로 읽히도록 만든 세트.
   원본이 4096이라 WORLD(2400)로 축소해도 선명하다. */
const MOON=loadImg(P_BG('moon_floor.jpg'));

function mulberry32(seed){
  let a=seed>>>0;
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function hexA(hex,a){
  const h=hex.replace('#','');
  const r=parseInt(h.slice(0,2),16), gg=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${gg},${b},${a})`;
}
/* 시트 인덱스: 셀 256×256, 5열4행. r(solid)이 있는 항목만 장애물 — 캐릭터·몬스터는 통과 못하고 총알은 통과한다 */
const DECOR=[
  /* 바닥 자국 — 먼저 깔린다 */
  {i:5,  n:10, size:[280,460], decal:true},

];
const OBJS=[]; // 충돌·그림자용 목록
function placeDecor(){
  if(OBJS.length) return; // 시드 고정 — 한 번만 배치하면 매판 같은 자리에 나온다
  const rndS=mulberry32(20260802);
  const TOWER={x:WORLD_CENTER.x, y:WORLD_CENTER.y, r:BASE_SIZE*6};
  for(const d of DECOR){
    const clearR=TOWER.r + d.size[1]/2 + 40; // 물체 자체 크기(최대치)+그림자 여유까지 감안해 코어 옆에 그림자가 걸치지 않게
    for(let k=0;k<d.n;k++){
      let x,y,tries=0;
      do{
        x=80+rndS()*(WORLD-160); y=80+rndS()*(WORLD-160);
        tries++;
      }while(tries<24 && (
        Math.hypot(x-TOWER.x,y-TOWER.y)<clearR ||               // 타워 주변 비우기(그림자까지 안 걸치게)
        (d.solid && OBJS.some(o=>Math.hypot(o.x-x,o.y-y)<(o.r+60))) // 장애물끼리 안 겹치게
      ));
      const s=d.size[0]+rndS()*(d.size[1]-d.size[0]);
      OBJS.push({i:d.i, x, y, s, rot:d.rot?rndS()*TAU:0,
        flip:rndS()<0.5, decal:!!d.decal, glow:d.glow,
        r:d.solid?s*d.solid:0});
    }
  }
}
function drawObj(g,o){
  const sx=(o.i%5)*256, sy=Math.floor(o.i/5)*256;
  g.save();
  g.translate(o.x,o.y);
  if(o.rot) g.rotate(o.rot);
  if(o.flip) g.scale(-1,1);
  g.drawImage(OBJ, sx,sy,256,256, -o.s/2,-o.s/2, o.s,o.s);
  g.restore();
}
function bakeDecals(g){ for(const o of OBJS){ if(o.decal) drawObj(g,o); } }
function bakeObjects(g){
  /* 아래쪽(y가 큰) 것을 나중에 그려야 앞뒤가 맞는다 */
  const list=OBJS.filter(o=>!o.decal).sort((a,b)=>a.y-b.y);
  for(const o of list){
    if(!o.glow){ // 그림자 먼저 — 입체감의 핵심
      g.fillStyle='rgba(0,0,0,0.34)';
      g.beginPath();
      g.ellipse(o.x+o.s*0.06, o.y+o.s*0.06, o.s*0.42, o.s*0.15, 0,0,TAU);
      g.fill();
    }
    if(o.glow){ // 크리스탈은 은은한 발광 원을 깔고 (0.20 이상 올리면 이펙트로 오인된다)
      const rg=g.createRadialGradient(o.x,o.y,0,o.x,o.y,o.s*1.5);
      rg.addColorStop(0, hexA(o.glow,0.20));
      rg.addColorStop(1, hexA(o.glow,0));
      g.fillStyle=rg;
      g.beginPath(); g.arc(o.x,o.y,o.s*1.5,0,TAU); g.fill();
    }
    drawObj(g,o);
  }
}
/* 타워 주변을 "지켜야 할 곳"으로 한눈에 알아보게 — 바닥에 함께 굽는다 */
function bakeTowerZone(g){
  const cx=WORLD_CENTER.x, cy=WORLD_CENTER.y, R=BASE_SIZE*5.4;
  g.save();
  g.translate(cx,cy); g.scale(1,0.62); // 위에서 본 시점이므로 눌러준다
  const pg=g.createRadialGradient(0,0,R*0.2,0,0,R);
  pg.addColorStop(0,'rgba(58,66,84,0.95)');
  pg.addColorStop(0.82,'rgba(42,48,62,0.95)');
  pg.addColorStop(1,'rgba(30,34,46,0.85)');
  g.fillStyle=pg; g.beginPath(); g.arc(0,0,R,0,TAU); g.fill();
  g.strokeStyle='rgba(96,108,132,0.55)'; g.lineWidth=2.5;
  for(let i=0;i<8;i++){
    const a=i*TAU/8;
    g.beginPath(); g.moveTo(Math.cos(a)*R*0.32,Math.sin(a)*R*0.32);
    g.lineTo(Math.cos(a)*R,Math.sin(a)*R); g.stroke();
  }
  g.beginPath(); g.arc(0,0,R*0.62,0,TAU); g.stroke();
  g.lineWidth=R*0.09; g.strokeStyle='rgba(210,170,60,0.32)';
  g.setLineDash([R*0.22,R*0.16]);
  g.beginPath(); g.arc(0,0,R*0.94,0,TAU); g.stroke();
  g.setLineDash([]);
  g.restore();
  g.strokeStyle='rgba(26,30,40,0.9)'; g.lineCap='round';
  for(let i=0;i<5;i++){
    const a=i*TAU/5+0.4;
    const ex=cx+Math.cos(a)*R*2.3, ey=cy+Math.sin(a)*R*2.3*0.62;
    g.lineWidth=5;
    g.beginPath(); g.moveTo(cx+Math.cos(a)*R*0.9, cy+Math.sin(a)*R*0.9*0.62);
    g.quadraticCurveTo((cx+ex)/2+30,(cy+ey)/2+22, ex,ey); g.stroke();
  }
  for(let i=0;i<4;i++){
    const a=i*TAU/4+Math.PI/4;
    const px=cx+Math.cos(a)*R*0.86, py=cy+Math.sin(a)*R*0.86*0.62;
    g.fillStyle='rgba(34,38,50,0.95)';
    g.fillRect(px-3, py-BASE_SIZE*0.5, 6, BASE_SIZE*0.5);
    const lg=g.createRadialGradient(px,py-BASE_SIZE*0.5,0,px,py-BASE_SIZE*0.5,BASE_SIZE*0.9);
    lg.addColorStop(0,'rgba(120,206,255,0.30)');
    lg.addColorStop(1,'rgba(120,206,255,0)');
    g.fillStyle=lg;
    g.beginPath(); g.arc(px,py-BASE_SIZE*0.5,BASE_SIZE*0.9,0,TAU); g.fill();
  }
  for(const [ox,oy] of [[-R*0.55,-R*0.42],[R*0.62,-R*0.30]]){
    const px=cx+ox, py=cy+oy*0.62;
    g.strokeStyle='rgba(40,46,60,0.95)'; g.lineWidth=4;
    g.beginPath(); g.moveTo(px,py); g.lineTo(px+6,py-BASE_SIZE*1.1); g.stroke();
    g.fillStyle='rgba(255,90,90,0.55)';
    g.beginPath(); g.arc(px+6,py-BASE_SIZE*1.1,3.5,0,TAU); g.fill();
  }
}
/* 조회용 격자 — r>0(장애물)만 담는다. 몬스터 격자(MGRID)와 같은 방식, 한 번만 지으면 되므로 비용이 없다 */
const OGRID=192; let _og=null, _ogw=0;
function buildObsGrid(){
  _ogw=Math.ceil(WORLD/OGRID);
  _og=Array.from({length:_ogw*_ogw},()=>[]);
  for(const o of OBJS){
    if(!o.r) continue;
    const cx=clamp((o.x/OGRID)|0,0,_ogw-1), cy=clamp((o.y/OGRID)|0,0,_ogw-1);
    _og[cy*_ogw+cx].push(o);

/* 이동 후 호출 — 장애물 안에 들어갔으면 밖으로 밀어낸다. 위에서 본 시점이라 세로를 1.7배 눌러 타원 판정 */
function resolveObstacles(ent, rad){
  if(!_og) return;
  const c0=clamp(((ent.x-rad-90)/OGRID)|0,0,_ogw-1), c1=clamp(((ent.x+rad+90)/OGRID)|0,0,_ogw-1);
  const r0=clamp(((ent.y-rad-90)/OGRID)|0,0,_ogw-1), r1=clamp(((ent.y+rad+90)/OGRID)|0,0,_ogw-1);
  for(let cy=r0;cy<=r1;cy++) for(let cx=c0;cx<=c1;cx++){
    for(const o of _og[cy*_ogw+cx]){
      const dx=ent.x-o.x, dy=(ent.y-o.y)*1.7;
      const d=Math.hypot(dx,dy)||1;
      const need=o.r+rad;
      if(d<need){
        const push=(need-d)/d;
        ent.x+=dx*push; ent.y+=dy*push/1.7;
      }
    }
  }
}

const SND_MIN_GAP={ mobHit:.07, machinegun:.05, xpPick:.05 };
const _lastSnd={};
function canPlay(k){
  const gap=SND_MIN_GAP[k]; if(!gap) return true;
  const now=performance.now()/1000;
  if((_lastSnd[k]||0)+gap>now) return false;
  _lastSnd[k]=now; return true;
}

/* ===== WebAudio 기반 효과음 =====
   기존엔 효과음 11종×5중복=55개 HTMLAudioElement를 미리 만들어 풀링했는데, iOS 사파리는 동시 오디오
   디코더 수 제한이 있고 play() 자체가 무겁다 — WebAudio 버퍼 하나만 디코드해두고 재생마다 가벼운
   BufferSource만 새로 만드는 방식으로 교체. BGM은 파일이 길어 전부 디코드하면 오히려 손해라 그대로 Audio 태그 사용. */
let AC=null, sfxGain=null, _bufs={}, _audioReady=false;
function initAudioCtx(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  sfxGain=AC.createGain(); sfxGain.connect(AC.destination);
}
async function loadSfxBuffers(){
  initAudioCtx();
  await Promise.all(Object.keys(SND_FILES).map(async k=>{
    try{
      const res=await fetch(P_SND(SND_FILES[k]));
      _bufs[k]=await AC.decodeAudioData(await res.arrayBuffer());
    }catch(e){ console.warn('사운드 로드 실패:',k,e); }
  }));
  _audioReady=true;
}
function playSfx(k,vol){
  if(!canPlay(k)) return;
  if(!_audioReady||!AC||!_bufs[k]) return;
  if(AC.state==='suspended') AC.resume();
  const src=AC.createBufferSource(); src.buffer=_bufs[k];
  const g=AC.createGain(); g.gain.value=clamp(vol??1,0,1);
  src.connect(g); g.connect(sfxGain); src.start(0);
}

/* ================= 모션 시스템 (종류별 세기, 위상 랜덤, 속도비례) ================= */
const MOTION_CFG={
  hero  :{rate:8.4, bounce:2.2, squash:.05, sway:.03, dust:'full'},
};
function motionCalc(e,dt,vx,vy,baseSpeed,cfg,timeNow){
  if(e.phase==null) e.phase=Math.random()*TAU;
  const spd=Math.hypot(vx,vy);
  const ratio=baseSpeed>0?clamp(spd/baseSpeed,0,1.6):0;
  const t=e.phase+timeNow*cfg.rate*Math.max(.12,ratio);
  const bounce=Math.abs(Math.sin(t))*cfg.bounce*SIZE_MUL*Math.max(.15,ratio);
  const squashY=1+Math.sin(t*2)*cfg.squash*Math.max(.2,ratio);
  const squashX=1/squashY;
  const sway=Math.sin(t*0.5)*cfg.sway*Math.max(.2,ratio);
  const s=Math.sin(t);
  let footPlant=false;
  if(e._prevSin!=null && e._prevSin>0 && s<=0 && ratio>0.1) footPlant=true;
  e._prevSin=s;
  const lift=clamp(bounce/((cfg.bounce*SIZE_MUL)||1),0,1);
  return {bounce,squashY,squashX,sway,footPlant,lift,dustKind:cfg.dust, t, ratio:Math.min(1,ratio)};
}

/* ================= 새 캐릭터: 몸통 1장 + 발 2쪽 =================
   16방향 시트가 아니라 정지 이미지 2장. 걷기는 프레임이 아니라 발을 코드로 흔들어서 만든다. */
/* 알파 여백 제거 → 캔버스 반환 (x0~x1 구간만 잘라낼 수도 있음) */
function trimToCanvas(src,x0,x1){
  x0=x0||0; x1=x1||src.width;
  const w=x1-x0, h=src.height;
  const c0=document.createElement('canvas'); c0.width=w; c0.height=h;
  const g0=c0.getContext('2d'); g0.drawImage(src,-x0,0);
  const d=g0.getImageData(0,0,w,h).data;
  let mnX=w,mxX=-1,mnY=h,mxY=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(d[(y*w+x)*4+3]>10){ if(x<mnX)mnX=x; if(x>mxX)mxX=x; if(y<mnY)mnY=y; if(y>mxY)mxY=y; }
  }
  if(mxX<0) return c0;
  const c=document.createElement('canvas');
  c.width=mxX-mnX+1; c.height=mxY-mnY+1;
  c.getContext('2d').drawImage(c0,-mnX,-mnY);
  return c;
}
/* 발 이미지 1장 = 신발 2쪽. 알파가 빈 세로줄로 갈라서 2장으로 분리 */
function splitFeet(img){
  const w=img.width,h=img.height;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); g.drawImage(img,0,0);
  const d=g.getImageData(0,0,w,h).data;
  const runs=[]; let s=null;
  for(let x=0;x<w;x++){
    let has=false;
    for(let y=0;y<h;y++){ if(d[(y*w+x)*4+3]>10){ has=true; break; } }
    if(has&&s===null) s=x;
    if(!has&&s!==null){ if(x-s>30) runs.push([s,x]); s=null; }
  }
  if(s!==null&&w-s>30) runs.push([s,w]);
  return runs.slice(0,2).map(r=>trimToCanvas(img,r[0],r[1]));
}
/* 원본을 한 번에 40배 줄이면 뭉개진다. 절반씩 단계적으로 줄여야 선명하다. */
function prescale(src,targetH){
  let c=src;
  while(c.height>targetH*2){
    const n=document.createElement('canvas');
    n.width =Math.max(1,Math.round(c.width /2));
    n.height=Math.max(1,Math.round(c.height/2));
    const g=n.getContext('2d');
    g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
    g.drawImage(c,0,0,n.width,n.height);
    c=n;
  }
  const f=document.createElement('canvas');
  f.height=Math.max(1,Math.round(targetH));
  f.width =Math.max(1,Math.round(c.width*f.height/c.height));
  const g=f.getContext('2d');
  g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
  g.drawImage(c,0,0,f.width,f.height);
  return f;
}
/* 표시 크기 × (DPR + 여유). 아이폰(DPR 3)이면 3.5배로 구워둔다 */

/* 방향 규칙: 원본 스프라이트는 "왼쪽을 보고 있는" 상태.
   몸통과 발은 같은 그룹으로 묶어 10도 기울인다. 오른쪽을 볼 때는 미러 → 각도도 같이 반전된다.
   ★ 미러를 먼저 걸고 그 안에서 회전해야 한다. 순서 바뀌면 오른쪽 볼 때 반대로 기운다. */
const HERO_TILT=-10*Math.PI/180;
const HERO_BODY_H=0.72;   // 몸통 높이 (size 비율)
const HERO_FOOT_H=0.26;   // 발 높이
const HERO_FOOT_GAP=0.05; // 몸통 바닥과 발 사이 빈 공간 — 오뚜기 몸통이 살짝 떠 보이게
const HERO_FOOT_X=0.07;   // 발 좌우 간격 (걸을 때 벌어지는 폭이 너무 넓다는 피드백으로 축소)
const HERO_FOOT_SWING=0.07; // 앞뒤 흔들림 진폭 (위와 동일 이유로 축소)
const HERO_FOOT_LIFT=0.05;  // 들어올리는 높이
/* 캐릭터별 체형 배율 — 없으면 1 */
const BODY_SCALE={
  boris:{w:1.28, h:1.12},   // 가로를 세로보다 많이 키운다 = 뚱뚱해 보임
};
function drawHero(charKey,x,groundY,face,size,opts){
  if(!isFinite(face)) face=Math.PI;                    // 조준각이 NaN이면(적 없음 등) 기본값으로 — 안 그러면 이후 그리기가 전부 씹힌다
  if(!isFinite(x)||!isFinite(groundY)) return {drawX:x||0,drawY:groundY||0};
  opts=opts||{};
  const P=HERO_PARTS[charKey];
  const m=opts.motion||{bounce:0,squashY:1,squashX:1,sway:0,lift:0,t:0,ratio:0};
  const bounce=m.bounce||0;
  /* 그림자 — 기울기·미러 바깥에서 그린다 */
  const sh=opts.shadowAlpha??0.36;
  if(sh>0){
    const ss=1-(m.lift||0)*0.28, sa=sh*(1-(m.lift||0)*0.35);
    ctx.fillStyle='rgba(0,0,0,'+Math.max(0,sa)+')';
    ctx.beginPath(); ctx.ellipse(x,groundY,size*0.30*ss,size*0.12*ss,0,0,TAU); ctx.fill();
  }
  if(!P||!P.ready){ // 로딩 전 대체 표시
    ctx.fillStyle=opts.tint||'#8f7ad6';
    ctx.beginPath(); ctx.arc(x,groundY-size*0.45,size*0.36,0,TAU); ctx.fill();
    return {drawX:x,drawY:groundY-bounce};
  }
  const mirror=Math.cos(face)<0?1:-1;  // 왼쪽(cos<0) = 원본 그대로, 오른쪽 = 미러
  if(!isFinite(mirror)) return {drawX:x,drawY:groundY};
  const t=m.t||0, amt=m.ratio||0;      // amt: 정지 시 0 → 흔들림이 자연스럽게 멎는다
  const swing=Math.sin(t)*size*HERO_FOOT_SWING*amt;
  ctx.save();
  ctx.translate(x,groundY);
  ctx.scale(mirror,1);                       // ① 미러 먼저
  ctx.translate(0,-size*0.35);
  ctx.rotate(HERO_TILT+(m.sway||0));         // ② 그 안에서 10도 기울임
  ctx.translate(0,size*0.35);
  const bs=BODY_SCALE[charKey]||{w:1,h:1};
  /* 발 2개 — 위상 반대 (한쪽이 앞으로 나가면 다른 쪽은 뒤로) */
  const fh=size*HERO_FOOT_H;
  for(let i=0;i<2;i++){
    const fc=P.feet[i]||P.feet[0]; if(!fc) break;
    const dir=i===0?1:-1;
    const sgn=Math.sin(t)*dir;
    const fx=dir*size*HERO_FOOT_X*bs.w+swing*dir;
    const fy=-Math.max(0,sgn)*size*HERO_FOOT_LIFT;
    const fw=fh*(fc.width/fc.height);
    ctx.drawImage(fc,fx-fw/2,fy-fh,fw,fh);
  }
  /* 몸통 — 발 위에서 GAP만큼 떠 있고, 바운스는 몸통에만 적용 */
  const bh=size*HERO_BODY_H*(m.squashY||1)*bs.h;
  const bw=size*HERO_BODY_H*(m.squashX||1)*(P.body.width/P.body.height)*bs.w;
  const by=-size*(HERO_FOOT_H+HERO_FOOT_GAP)-bounce;
  ctx.drawImage(P.body,-bw/2,by-bh,bw,bh);
  ctx.restore();
  return {drawX:x, drawY:groundY-bounce};
}

}

/* 모드별 역할 배분 — 수호 모드만 일부가 코어를 지키고, 그 외(유랑·무한)는 전원 개인 플레이 */
function assignRoles(mode,n){
  if(mode==='guard'){
    if(n<=1) return ['guard'];
    if(n===2) return ['guard','solo'];
    return ['guard','guard','solo'];
  }
  return Array(n).fill('solo');
}
function newGame(mode,charKey,gunId,teamSize,diff){
  const c=WORLD/2;
  const hasTower=mode!=='infinite';
  const player=newMember(charKey,true,gunId);
  player.x=c; player.y=c+120;
  const allies=[];
  const otherChars=Object.keys(CHARACTERS).filter(k=>k!==charKey);
  const remainGuns=shuffle(GUNS.filter(g=>g!==gunId));
  const roles=assignRoles(mode,teamSize-1);
  for(let i=0;i<teamSize-1;i++){
    const ck=otherChars[i%otherChars.length];
    const gid=remainGuns[i%remainGuns.length];
    const a=newMember(ck,false,gid);
    const ang=(i/(teamSize-1||1))*Math.PI*2;
    a.x=c+Math.cos(ang)*90; a.y=c+120+Math.sin(ang)*90;
    a.formOff={x:Math.cos(ang)*70,y:Math.sin(ang)*70};
    a.role=roles[i]; a.slot=i; a.slotAng=ang;
    allies.push(a);
  }
  G={
    mode, teamSize, diff, time:0, wave:1, waveT:0, waveLen:22,
    player, allies,
    tower: hasTower?{x:c,y:c,r:22*SIZE_MUL,hp:1400,maxHp:1400,shield:0,maxShield:0}:null,

    pickLog:{total:0,items:{},weapons:{},pets:{}},
  };
  NUKE.active=false; NUKE.phase=''; NUKE.t=0;
  updateItemSlot();

  shake=0;
}

/* 15웨이브까지는 완만하게, 그 뒤로는 난이도별 late 배율만큼 기울기가 가팔라진다(기본 2.2배) */
function waveScale(w){
  const K=DIFFICULTY[G.diff];
  const hp  = w<=15 ? 1+(w-1)*0.10 : 1+14*0.10+(w-15)*0.22*K.late;
  const dmg = w<=15 ? 1+(w-1)*0.05 : 1+14*0.05+(w-15)*0.10*K.late;
  const spd = Math.min(1.45,1+(w-1)*0.008); // 이동속도는 상한을 둔다 — 너무 빠르면 피할 방법이 없어 스트레스가 된다
  return {hp:hp*K.hpMul, dmg:dmg*K.dmgMul, spd};
}
const hpMul=()=>waveScale(G.wave).hp;
const dmgMul=()=>waveScale(G.wave).dmg;
const spdMul=()=>waveScale(G.wave).spd;
const moveEvery=()=>G.wave<10?3:2;
/* bossN = 이 판에서 몇 번째로 등장하는 보스인가(1부터) — 회차마다 커지되 화면을 다 덮지 않게 상한(1.9배)을 둔다 */
function bossScale(bossN){
  return {
    size: 2.20*(1+Math.min(0.90,(bossN-1)*0.12)),
    hp: 700+(bossN-1)*320,
  };
}
function spawnMob(type,pos,overrides){
  if(G.mobs.length>120) return;
  const d=MOBS[type]; overrides=overrides||{};
  let p=pos;
  if(!p){
    const a=Math.random()*Math.PI*2, rad=Math.max(W,H)*0.62+rnd(40,180);
    const anchor=G.player;
    p={x:clamp(anchor.x+Math.cos(a)*rad,40,WORLD-40), y:clamp(anchor.y+Math.sin(a)*rad,40,WORLD-40)};
  }
  const size=overrides.size!==undefined?overrides.size:BASE_SIZE*d.sizeScale;
  const r=size*(d.hitR??0.36);
  const hy=size*(d.hitY??0); // 판정 원 중심의 y 오프셋(위쪽이 음수) — 코드로 그리는 몬스터는 몸통을 접지점보다 위에 그리므로 필요
  const hp=overrides.hp!==undefined?overrides.hp:d.hp*hpMul();
  G.mobs.push({t:type,x:p.x,y:p.y,r,hy,size,hp,maxHp:hp,sp:d.sp*spdMul(),dmg:d.dmg*dmgMul(),
    xp:d.xp, boss:overrides.boss!==undefined?overrides.boss:!!d.boss, tier:overrides.tier||0,
    ranged:!!d.ranged, tint:d.tint, prone:!!d.prone, shape:d.shape,
    atkT:0,slow:0,hit:0,face:Math.random()*6.283,phase:Math.random()*TAU,tp:false,_mt:Math.random()*6.283});
}
function waveComp(){
  const w=G.wave, pool=['crawler'];
  if(w>=3) pool.push('hunter');
  if(w>=6) pool.push('golemite');
  if(w>=7) pool.push('stinger');
  if(w>=9) pool.push('crawler');
  return pool;
}
function updateWave(dt){
  G.waveT+=dt;
  G.spawnT-=dt;
  if(G.spawnT<=0){
    G.spawnT=Math.max(0.20,1.15-G.wave*0.045)/DIFFICULTY[G.diff].spawnMul; // spawnMul은 "스폰 속도"이므로 간격에는 나눠서 적용(값이 클수록 더 자주 나오게)
    const n=1+Math.floor(G.wave/6)+Math.max(0,G.teamSize-1);
    for(let i=0;i<n;i++) spawnMob(pick(waveComp()));
  }
  if(G.waveT>=G.waveLen){
    G.waveT=0; G.wave++;
    if(G.wave%5===0){
      const n=Math.floor(G.wave/10)+1;
      for(let i=0;i<n;i++){
        G.bossCount=(G.bossCount||0)+1;
        const bs=bossScale(G.bossCount);
        spawnMob('tyrant',null,{hp:bs.hp*DIFFICULTY[G.diff].bossMul, size:BASE_SIZE*bs.size});
      }
      addFx({k:'txt',x:G.player.x,y:G.player.y-60,txt:'⚠ 코어 타이런트 출현',c:'#ff4d6d',size:22,life:1.6,vy:-24});
    }
    if(G.mode==='roam' && G.tower){
      G.movesIn--;
      if(G.movesIn===1 && !G.nextT){
        const a=Math.random()*Math.PI*2, d=rnd(500,860);
        G.nextT={x:clamp(G.tower.x+Math.cos(a)*d,220,WORLD-220), y:clamp(G.tower.y+Math.sin(a)*d,220,WORLD-220)};
        G.coreMoveMsg={t:0,life:3};
      }
      if(G.movesIn<=0 && G.nextT){
        addFx({k:'ring',x:G.tower.x,y:G.tower.y,r0:11,r1:109,c:'#ffb347',life:.6});
        G.tower.x=G.nextT.x; G.tower.y=G.nextT.y; G.nextT=null;
        G.movesIn=moveEvery(); shake=10;
        addFx({k:'ring',x:G.tower.x,y:G.tower.y,r0:109,r1:13,c:'#ffd98a',life:.6});
        addFx({k:'txt',x:G.tower.x,y:G.tower.y-70,txt:'코어 이동 완료',c:'#ffd166',size:18,life:1.6,vy:-22});
      }
    }
  }
}

/* 중심 정렬이 아니라 이미지 안의 원점(ax,ay, 원본 픽셀 기준)을 지정 좌표에 고정하고 회전만 시킨다(좌우반전 없음) */
function mkAnchoredFx(sheet,x,y,angle,ax,ay,scale,duration){ if(G.fxAnim.length<36) G.fxAnim.push({sheet,x,y,angle,ax,ay,scale,anchored:true,t:0,duration}); }
/* ---------------------- 데미지 숫자 — 일반/강타/크리티컬/초강타 4단계 말풍선 배지 ---------------------- */
const DMG_CAP=60;
function fmtDmg(v){
  v=Math.round(v);
  if(v>=10000) return Math.round(v/1000)+'K';
  if(v>=1000)  return (v/1000).toFixed(1)+'K';
  return ''+v;
}
function pushDmgText(x,y,v,isCrit,baseDmg,opts){
  opts=opts||{};
  let tier=opts.forceTier;
  if(!tier){
    tier='normal';
    if(isCrit && v>=1000) tier='mega';
    else if(isCrit)       tier='crit';
    else if(v>=baseDmg*2.5) tier='big';
  }
  if(tier==='normal' && Math.random()>0.45) return; // 일반은 45%만 표시 — 화면이 안 깨끗해지게
  if(G.dmgTxt.length>=DMG_CAP){
    const i=G.dmgTxt.findIndex(d=>d.tier==='normal'); // 일반부터 버린다 — 크리티컬·초강타는 항상 보이게
    G.dmgTxt.splice(i>=0?i:0,1);
  }
  G.dmgTxt.push({
    x,y,v,tier,t:0,life:0.78,delay:opts.delay||0,
    vx:(Math.random()-0.5)*BASE_SIZE*0.9,
    vy:-BASE_SIZE*(1.5+Math.random()*0.5),
    rot:(Math.random()-0.5)*0.28
  });
}
function starburstPath(g,x,y,r,spikes,inner){
  g.beginPath();
  for(let i=0;i<spikes*2;i++){
    const a=i*Math.PI/spikes - Math.PI/2;
    const rr=(i%2)?r*inner:r;
    const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr*0.78;
    i?g.lineTo(px,py):g.moveTo(px,py);
  }
  g.closePath();
}
const DMG_STYLE={
  normal:{fs:0.34, fill:'#ffffff', stroke:'rgba(10,12,20,.85)', badge:null},
  big   :{fs:0.44, fill:'#ffd84a', stroke:'rgba(40,20,0,.9)',   badge:null},
  crit  :{fs:0.52, fill:'#fff3c4', stroke:'rgba(60,26,0,.95)',
          badge:{c1:'#ffd34a', c2:'#ff8a1e', edge:'#5a2a00', spikes:9, inner:0.66}},
  mega  :{fs:0.62, fill:'#ffffff', stroke:'rgba(70,0,0,.95)',
          badge:{c1:'#ff5a4a', c2:'#c81020', edge:'#4a0008', spikes:11, inner:0.62}},
};
function drawDmgTexts(){
  for(const d of G.dmgTxt){
    const k=d.t/d.life;
    const pop = k<0.14 ? (k/0.14)*1.25
              : k<0.26 ? 1.25-((k-0.14)/0.12)*0.25
              : 1.0;
    const a = (k<0.62 ? 1 : 1-(k-0.62)/0.38) * fxOpacity;
    if(a<=0) continue;
    const S=DMG_STYLE[d.tier];
    const fs=BASE_SIZE*S.fs*pop;
    const txt=fmtDmg(d.v);

    ctx.save();
    ctx.globalAlpha=a;
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot*(1-k));
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='900 '+fs.toFixed(1)+'px system-ui';

    if(S.badge){
      const w=ctx.measureText(txt).width;
      const r=Math.max(w*0.72, fs*0.95);
      ctx.fillStyle='rgba(0,0,0,.35)';
      starburstPath(ctx,2,3,r,S.badge.spikes,S.badge.inner); ctx.fill();
      const g=ctx.createLinearGradient(0,-r,0,r);
      g.addColorStop(0,S.badge.c1); g.addColorStop(1,S.badge.c2);
      ctx.fillStyle=g;
      starburstPath(ctx,0,0,r,S.badge.spikes,S.badge.inner); ctx.fill();
      ctx.lineWidth=Math.max(2,fs*0.10); ctx.strokeStyle=S.badge.edge;
      starburstPath(ctx,0,0,r,S.badge.spikes,S.badge.inner); ctx.stroke();
    }
    ctx.lineWidth=Math.max(2.5,fs*0.16);
    ctx.strokeStyle=S.stroke; ctx.strokeText(txt,0,0);
    ctx.fillStyle=S.fill;     ctx.fillText(txt,0,0);
    ctx.restore();
  }
}
function hurt(m,dmg,critCh,critMul,opts){
  opts=opts||{};
  critCh=critCh??.05; critMul=critMul??2;
  let crit=Math.random()<critCh;
  let d=dmg*(crit?critMul:1);
  m.hp-=d; m.hit=.12;
  AudioMgr.play('mobHit');
  if(!opts.silentText) pushDmgText(m.x+rnd(-8,8), m.y-m.r-4, d, crit, dmg);
  if(m.hp<=0) killMob(m);
  return d;
}
/* 몬스터 등급별 경험치 구슬 — 약함(파랑) < 중간(주황) < 강함(초록) */
function xpTier(xpVal){
  if(xpVal>=15) return {c:'#7dffb0',glow:'#c8ffe4',mul:1.5,size:6.5};
  if(xpVal>=6.5) return {c:'#ffb04d',glow:'#ffe1b0',mul:1.2,size:5.5};
  return {c:'#5fa8ff',glow:'#bfe0ff',mul:1,size:4.6};
}
/* 종별 껍질/체색 — 실제 스프라이트에서 채도 있는 픽셀만 뽑아 평균낸 뒤 살짝 채도를 올린 값(사망 파편용) */
const MOB_SHELL_COLOR={
  crawler:'#806c5a', hunter:'#97316f', golemite:'#8c7c68', stinger:'#172287', tyrant:'#b59aa5',
};
/* 몸이 조각나서 흩어지는 사망 연출 — 원본 이미지의 일부를 잘라 날려서 진짜 몸이 부서진 것처럼 보이게 한다 */
const GIB_CAP=200;
const GIB_BLOOD_COLORS=['#8a1622','#6e1420','#a3202c'];
function spawnGibs(m){
  const I=MOB_IMG[m.shape];
  const big=m.boss;
  const shellC=m.tint||MOB_SHELL_COLOR[m.shape]||'#b79cff';
  const n=(8+Math.floor(Math.random()*4))*(big?3:1);
  for(let i=0;i<n;i++){
    if(G.gibs.length>=GIB_CAP) G.gibs.shift();
    const a=Math.random()*TAU, sp=m.size*(2.2+Math.random()*3.4);
    G.gibs.push({
      x:m.x, y:m.y+(m.hy||0),
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-m.size*1.6,   // 살짝 위로 튀어오름
      rot:Math.random()*TAU, vr:(Math.random()-0.5)*14,
      size:m.size*(0.14+Math.random()*0.16)*(big?1.5:1),
      t:0, life:0.55+Math.random()*0.35,
      img:I?I.img:null,
      sx:Math.random(), sy:Math.random(),                // 원본에서 잘라 쓸 위치
      col: Math.random()<0.55 ? shellC : pick(GIB_BLOOD_COLORS), // 껍질/피 색 — 아래 불투명 밑색으로 써서 항상 진하게 보이게 함
    });
  }
}
function drawGibs(){
  for(const g of G.gibs){
    const k=g.t/g.life;
    const a=(1-k*k)*fxOpacity;
    if(a<=0) continue;
    ctx.save();
    ctx.globalAlpha=a;
    ctx.translate(g.x,g.y); ctx.rotate(g.rot);
    // 밑색을 불투명하게 먼저 깔아 무작위 크롭이 밝고 흐릿한 부분을 뽑아도 항상 진하고 또렷하게 보이게 한다
    ctx.fillStyle=g.col||'#7a5a6a';
    ctx.fillRect(-g.size/2,-g.size/2,g.size,g.size);
    if(g.img){
      const iw=g.img.width, ih=g.img.height;
      const cw=iw*0.28, ch=ih*0.28;
      ctx.globalAlpha=a*0.85;
      ctx.drawImage(g.img, g.sx*(iw-cw), g.sy*(ih-ch), cw, ch,
                    -g.size/2,-g.size/2, g.size, g.size);
    }
    ctx.restore();
  }
}
function killMob(m){
  m.dead=true; G.kills++;
  const big=m.boss;
  const shardN=Math.min(34,Math.round((big?30:16)*(m.size/BASE_SIZE)));
  const bloodN=Math.min(30,Math.round((big?26:15)*(m.size/BASE_SIZE)));
  const shellC=m.tint||MOB_SHELL_COLOR[m.shape]||'#b79cff';
  addFx({k:'flash',x:m.x,y:m.y,r0:3,r1:m.r*(big?2.6:1.9),c:'#ffffff',life:big?.4:.22});
  addFx({k:'blood',x:m.x,y:m.y,n:bloodN,life:big?1.0:.7,r:m.r});
  addFx({k:'shard',x:m.x,y:m.y,c:shellC,n:shardN,life:big?1.0:.62,r:m.r});
  addFx({k:'shard',x:m.x,y:m.y,c:shellC,n:Math.round(shardN*0.6),life:big?.8:.5,r:m.r*1.4}); // 더 크고 멀리 튀는 큰 파편도 섞어서 "팍 터지는" 느낌
  addFx({k:'ring',x:m.x,y:m.y,r0:3,r1:m.r*(big?3.6:2.7),c:'#ffffff',life:big?.6:.34});
  spawnGibs(m);
  shake=Math.max(shake,big?16:2.6);
  const n=m.boss?14:1;
  const tier=xpTier(m.xp);
  for(let i=0;i<n;i++) G.orbs.push({x:m.x+rnd(-8,8),y:m.y+rnd(-8,8),v:m.xp/n*tier.mul*DIFFICULTY[G.diff].xpMul,t:0,c:tier.c,glow:tier.glow,size:tier.size});
  if(m.t==='tyrant' && (m.tier||0)<2){
    AudioMgr.play('explosion');
    const nt=(m.tier||0)+1, nSize=m.size*0.56, nHp=m.maxHp*0.42;
    for(let i=0;i<2;i++){
      const a=rnd(0,Math.PI*2);
      spawnMob('tyrant',{x:clamp(m.x+Math.cos(a)*20,40,WORLD-40),y:clamp(m.y+Math.sin(a)*20,40,WORLD-40)},{tier:nt,size:nSize,hp:nHp,boss:false});
    }
    shake=Math.max(shake,10);
  } else if(m.boss){ shake=16; spawnBox(m.x,m.y); AudioMgr.play('explosion'); }
  else if(Math.random()<0.012) spawnBox(m.x,m.y);
}
/* ===== 몬스터 공간 격자 — 투사체×몹 전수검사(프레임당 최대 수만 회)를 줄인다 ===== */
const MGRID=128;
let _gw=0, _cells=null, _mobGridReach=60;
function buildMobGrid(){
  const need=Math.ceil(WORLD/MGRID);
  if(_gw!==need||!_cells){
    _gw=need; _cells=new Array(_gw*_gw);
    for(let i=0;i<_cells.length;i++) _cells[i]=[];
  } else {
    for(let i=0;i<_cells.length;i++) _cells[i].length=0;
  }
  _mobGridReach=60;
  for(const m of G.mobs){
    if(m.dead) continue;
    _mobGridReach=Math.max(_mobGridReach,Math.abs(m.hy||0)+m.r+BASE_SIZE*0.10);
    const cx=clamp((m.x/MGRID)|0,0,_gw-1), cy=clamp((m.y/MGRID)|0,0,_gw-1);
    _cells[cy*_gw+cx].push(m);
  }
}
/* ★ out 버퍼는 호출부가 각자 소유해야 한다. 공용 버퍼 하나를 돌려쓰면 중첩 호출(투사체 루프 안의 areaDmg 등) 때 덮어써진다 */
function queryMobs(x,y,r,out){
  out.length=0;
  const c0=clamp(((x-r)/MGRID)|0,0,_gw-1), c1=clamp(((x+r)/MGRID)|0,0,_gw-1);
  const r0=clamp(((y-r)/MGRID)|0,0,_gw-1), r1=clamp(((y+r)/MGRID)|0,0,_gw-1);
  for(let cy=r0;cy<=r1;cy++){
    for(let cx=c0;cx<=c1;cx++){
      const cell=_cells[cy*_gw+cx];
      for(let i=0;i<cell.length;i++) out.push(cell[i]);
    }
  }
  return out;
}
const _qProj=[], _qProjHits=[], _qArea=[], _qNear=[], _qPet=[], _qSpawn=[], _qSpawnHits=[], _qKatana=[], _qTornado=[], _qAllyScan=[];
/* 반경 r 안에서 몹이 가장 몰려있는 지점(가장 가까운 이웃이 많은 몹)을 찾는다 — 개인 플레이 아군이 무리를 우선 노리게 함 */
function densestCluster(x,y,r){
  const cand=queryMobs(x,y,r,_qAllyScan);
  let best=null,bestScore=-1;
  for(let i=0;i<cand.length;i++){
    const m=cand[i]; if(m.dead) continue;
    let score=0;
    for(let j=0;j<cand.length;j++){
      const o=cand[j]; if(o.dead||o===m) continue;
      if(Math.hypot(o.x-m.x,o.y-m.y)<BASE_SIZE*3) score++;
    }
    if(score>bestScore){ bestScore=score; best=m; }
  }
  return bestScore>=1?best:null; // 최소 2마리 이상 뭉쳐 있을 때만 "무리"로 취급
}
function areaDmg(x,y,r,dmg,c,critCh,critMul){
  addFx({k:'ring',x,y,r0:r*.3,r1:r,c:c||'#ffb347',life:.3});
  const cand=queryMobs(x,y,r+60,_qArea);
  for(let i=0;i<cand.length;i++){ const m=cand[i]; if(m.dead)continue; const dx=m.x-x,dy=(m.y+(m.hy||0))-y,rr=r+m.r; if(dx*dx+dy*dy<rr*rr) hurt(m,dmg,critCh,critMul); }
}
/* 빠른 투사체의 터널링 방지 — 한 점이 아니라 이전 위치→현재 위치 선분과 원의 충돌을 본다 */
function segCircleHitT(p0x,p0y,p1x,p1y,cx,cy,r){
  const dx=p1x-p0x, dy=p1y-p0y;
  const fx=p0x-cx, fy=p0y-cy;
  const a=dx*dx+dy*dy;
  const c=fx*fx+fy*fy-r*r;
  if(c<=0) return 0; // 이미 몬스터 몸 안에서 시작한 총알
  if(a===0) return null;
  const b=2*(fx*dx+fy*dy), disc=b*b-4*a*c;
  if(disc<0) return null;
  const sd=Math.sqrt(disc);
  const t0=(-b-sd)/(2*a), t1=(-b+sd)/(2*a);
  if(t0>=0&&t0<=1) return t0;
  if(t1>=0&&t1<=1) return t1;
  return null;
}
function segHitsCircle(p0x,p0y,p1x,p1y,cx,cy,r){
  return segCircleHitT(p0x,p0y,p1x,p1y,cx,cy,r)!==null;
}
/* 화면 안(약간의 여유 포함)에 있는가 — 카메라 밖 몬스터를 조준하지 않게 막는다.
   pad를 0으로 두면 화면 경계에서 조준이 깜빡이므로, 몸 절반쯤 걸친 적은 여전히 쏠 수 있게 여유를 둔다 */
function onScreen(m,pad){
  pad = pad ?? BASE_SIZE*0.8;
  return m.x > cam.x-pad && m.x < cam.x+W+pad
      && m.y > cam.y-pad && m.y < cam.y+H+pad;
}
function nearest(x,y,range,skip,anyScreen){
  let best=null,bd=range*range;
  let bestBoss=null,bdBoss=range*range;
  const cand=queryMobs(x,y,range+60,_qNear);
  for(let i=0;i<cand.length;i++){ const m=cand[i]; if(m.dead||(skip&&skip.has(m)))continue;
    if(!anyScreen && !onScreen(m)) continue; // 화면 밖은 조준 대상에서 제외 — 단, 아군 AI처럼 플레이어 화면 밖까지 혼자 돌아다니는 경우엔 anyScreen=true로 이 필터를 건너뛴다
    const d=(m.x-x)**2+(m.y-y)**2;
    if(d<bd){bd=d;best=m;}
    if(m.boss && d<bdBoss){bdBoss=d;bestBoss=m;}
  }
  return bestBoss||best; // 보스가 사거리 안에 있으면 항상 1순위 — 자동사냥·AI아군 타겟팅 전부 여기를 공유한다
}
/* 예측 조준 — 총알이 도달할 시간만큼 몬스터의 이동 방향 앞을 조준한다. 안 넣으면 움직이는 표적을 계속 스쳐 지나간다 */
function leadAim(ox,oy,m,bulletSpeed){
  const tx=m.x, ty=m.y+(m.hy||0);
  let t=Math.hypot(tx-ox,ty-oy)/Math.max(1,bulletSpeed);
  for(let i=0;i<2;i++){
    const px=tx+(m.vx||0)*t, py=ty+(m.vy||0)*t;
    t=Math.hypot(px-ox,py-oy)/Math.max(1,bulletSpeed);
  }
  const px=tx+(m.vx||0)*t, py=ty+(m.vy||0)*t;
  return Math.atan2(py-oy, px-ox);
}
/* ---------------------- 무기 발사 ---------------------- */
function wStat(e,w){
  const d=WEAPONS[w.id], k=w.lv-1;
  const count = d.stackMax ? Math.min(d.stackMax,w.lv) : (d.count||1)+Math.floor(k/2);
  return {d, dmg:d.dmg*(1+.38*k)*e.st.atk*(w.dmgMul||1), range:(d.range||0)+k*10,
    count, pierce:(d.pierce||1)+Math.floor(k/3)};
}
const PROJ_CAP=160, EPROJ_CAP=80;
/* AI 팀원 총성 거리 감쇠 — 가까우면 원음, 한 화면 이상 멀어지면 아주 작게만 들린다. */
function allyGunSfxMul(e){
  if(!G||!G.player||!e||e.isPlayer) return 1;
  const distance=Math.hypot(e.x-G.player.x,e.y-G.player.y);
  const near=BASE_SIZE*3, far=900;
  const t=clamp((distance-near)/(far-near),0,1);
  return 0.06+0.94*Math.pow(1-t,1.4);
}
function spawnProj(e,ox,oy,ang,s,d,soundMul){
  const c=s.count, sp=d.spread||0;
  const dispLen = d.bulletImg==='bullet'        ? gunRenderLen(d.gunImg,1)*0.55   // 기존 0.70에서 축소
                : d.bulletImg==='minigunBullet' ? gunRenderLen(d.gunImg,1)*0.95   // 더 크게 (기존 0.52는 너무 작다는 피드백)
                : undefined;
  const stagger=d.stackMax?0.1:0; // 마력구·화염구는 동시가 아니라 0.1초 간격으로 따다닥
  const ex0=e.drawX??e.x, ey0=(e.drawY??e.y)-BASE_SIZE*0.45;
  for(let i=0;i<c;i++){
    if(G.projs.length>=PROJ_CAP){ G.projs.shift(); } // 상한 초과시 가장 오래된 것부터 제거
    const a=ang+(c>1&&!d.stackMax?(i-(c-1)/2)*sp:0)+rnd(-.03,.03);
    const b={x:ox,y:oy,x0:ex0,y0:ey0,vx:Math.cos(a)*d.sp,vy:Math.sin(a)*d.sp,dmg:s.dmg,
      r:d.dispSize?d.dispSize*0.35:(d.kind==='homing'?5:3),c:d.c,pierce:s.pierce,aoe:d.aoe||0,life:2.6,maxLife:2.6,
      homing:d.kind==='homing'?nearest(ox,oy,s.range):null,hs:new Set(),
      bulletImg:d.bulletImg,fxProj:d.fxProj,fxFront:d.fxFront||0,dispSize:d.dispSize,dispLen,anim:0,delay:i*stagger,
      trail:(d.fxFront!=null||d.bulletImg)?[{x:ox,y:oy},{x:ox,y:oy},{x:ox,y:oy},{x:ox,y:oy},{x:ox,y:oy},{x:ox,y:oy}]:null,trailHead:0,trailLen:0,
      crit:e.st.crit,cdmg:e.st.cdmg};
    G.projs.push(b);
    /* ★ 몬스터가 총구보다 캐릭터에 더 가까이 붙어있으면 총알이 이미 지나친 채로 태어난다 —
       캐릭터 중심~총구 구간을 즉시 한 번 판정해서 근접한 적도 맞도록 한다 */
    if(!b.delay){
      const cand=queryMobs(ex0,ey0,BASE_SIZE*1.6+_mobGridReach,_qSpawn);
      _qSpawnHits.length=0;
      for(let j=0;j<cand.length;j++){
        const m=cand[j];
        if(m.dead||b.hs.has(m))continue;
        const hitT=segCircleHitT(b.x0,b.y0,b.x,b.y,m.x,m.y+(m.hy||0),m.r+b.r+BASE_SIZE*0.10);
        if(hitT!==null) _qSpawnHits.push({m,t:hitT});
      }
      if(_qSpawnHits.length>1) _qSpawnHits.sort((a,b)=>a.t-b.t);
      for(const hit of _qSpawnHits){
        const m=hit.m; if(m.dead||b.hs.has(m)) continue;
        b.hs.add(m);
        const ix=b.x0+(b.x-b.x0)*hit.t, iy=b.y0+(b.y-b.y0)*hit.t;
        if(b.aoe){
          b.x=ix; b.y=iy;
          areaDmg(ix,iy,b.aoe,b.dmg,b.c,b.crit,b.cdmg); AudioMgr.play('explosion');
          addFx({k:'flash',x:ix,y:iy,r0:5,r1:b.aoe*0.8,c:'#fff',life:.3});
          shake=Math.max(shake,7);
          b.life=0; break;
        }
        hurt(m,b.dmg,b.crit,b.cdmg); b.pierce--;
        if(b.pierce<=0){ b.x=ix; b.y=iy; b.life=0; break; }
      }
    }
  }
  if(d.snd) AudioMgr.play(d.snd,soundMul??1);
}
function fireLightning(e,w){
  const d=WEAPONS.lightning;
  const n=Math.min(10,3+(w.lv-1)*2);
  const ex=e.x, ey=e.y;
  const cand=queryMobs(ex,ey,d.range+60,_qNear)
    .filter(m=>!m.dead && Math.hypot(m.x-ex,(m.y+(m.hy||0))-ey)<d.range)
    .sort((a,b)=>Math.hypot(a.x-ex,a.y-ey)-Math.hypot(b.x-ex,b.y-ey))
    .slice(0,n);
  if(!cand.length) return false;
  const dmg=d.dmg*(1+(w.lv-1)*0.28)*e.st.atk*(w.dmgMul||1);
  const ox=e.drawX??ex, oy=(e.drawY??ey)-BASE_SIZE*0.55;
  for(const m of cand){
    hurt(m,dmg,e.st.crit,e.st.cdmg);
    G.bolts.push({
      x0:ox,y0:oy,x1:m.x,y1:m.y+(m.hy||0),
      t:0,life:0.26,seed:Math.random()*1000,

    });

  AudioMgr.play(d.snd,0.9);
  shake=Math.max(shake,e.isPlayer?4:0);

}
/* ---------------------- 카타나 — 들어올림→내려침→복귀 3단 이징 스윙 + 블러드 최종 10회 회전참격 ---------------------- */
const SLASH_OFFSETS=[0,-Math.PI*0.42,Math.PI*0.42,Math.PI]; // 1번째=이동방향, 이후 좌대각·우대각·뒤로 벌어짐
/* 베는 기준 방향 — 이동 중이면 이동 방향 우선(그래야 앞뒤앞뒤가 안 됨), 아니면 조준/마지막 방향 */
function slashBaseAngle(e){
  if(e.moving && isFinite(e.moveAng)) return e.moveAng;
  return isFinite(e.aimAngle)?e.aimAngle:Math.PI;
}
/* 각도 정의: 베는 방향(base)을 0으로 두고 칼이 그 방향과 이루는 상대각. 양수=발 쪽(아래), 음수=머리 쪽(위) */
const K_REST   =  28*Math.PI/180;   // 기본 자세 — 칼끝이 앞아래
const K_WINDUP = -152*Math.PI/180;  // 머리 위로 넘겨 뒤쪽까지 젖힘
const K_STRIKE =  58*Math.PI/180;   // 앞아래로 완전히 내려침
const SW_UP=0.130, SW_HIT=0.075, SW_REC=0.110;
const SW_TOTAL=SW_UP+SW_HIT+SW_REC;
const SW_OVERLAP=0.55; // 복귀 구간의 55%를 다음 베기의 들어올림과 겹친다
const SW_STEP=SW_UP+SW_HIT+SW_REC*(1-SW_OVERLAP); // 다음 베기 시작 간격 ≈ 0.255초
const easeOutBack=p=>{ const c1=1.32,c3=c1+1; return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2); };
const easeInQuart=p=>p*p*p*p;
const easeOutCubic=p=>1-Math.pow(1-p,3);
/* 경과 시간 t(초)에 대한 칼의 base 기준 상대각 — 들어올림은 빠르게 올라가 정점에서 멈칫, 내려침은 폭발적으로 가속, 복귀는 부드럽게 감속 */
function katanaSwingAngle(t){
  if(t<SW_UP) return K_REST+(K_WINDUP-K_REST)*easeOutBack(t/SW_UP);
  if(t<SW_UP+SW_HIT) return K_WINDUP+(K_STRIKE-K_WINDUP)*easeInQuart((t-SW_UP)/SW_HIT);
  if(t<SW_TOTAL) return K_STRIKE+(K_REST-K_STRIKE)*easeOutCubic((t-SW_UP-SW_HIT)/SW_REC);
  return K_REST;
}
/* 내려치는 순간 캐릭터도 같이 반응한다 — 들어올릴 때 살짝 뒤로, 내려칠 때 앞으로 확, 이후 복귀 */
function katanaBodyOffset(t){
  if(t<SW_UP){ const p=t/SW_UP; return {lean:-0.06*p, push:-0.10*p}; }
  if(t<SW_UP+SW_HIT){ const p=easeInQuart((t-SW_UP)/SW_HIT); return {lean:-0.06+0.16*p, push:-0.10+0.34*p}; }
  const p=easeOutCubic((t-SW_UP-SW_HIT)/SW_REC);
  return {lean:0.10*(1-p), push:0.24*(1-p)};
}
function spawnSlashFx(e,w,ang){
  const d=WEAPONS[w.id];
  const ex=e.drawX??e.x, ey=(e.drawY??e.y)-BASE_SIZE*0.45;
  const fx=ex+Math.cos(ang)*d.range*0.48, fy=ey+Math.sin(ang)*d.range*0.48;
  const sheet=FX_SHEETS[d.fx];
  const fxSize=BASE_SIZE*2.2; // 3.4→2.2 — 캐릭터 키의 3.4배는 과했다는 피드백으로 축소 (판정범위 d.range는 그대로)
  const scale=fxSize/sheet.cell[0];
  const duration=0.40; // 재생 0.40초 + 마지막 프레임을 0.18초 더 페이드아웃(drawFxAnims가 duration 넘어도 자연 소멸하므로 여유를 둠)
  mkFxAnim(sheet,fx,fy,ang,scale*1.30,duration); // ① 바깥 광채 — 작아진 만큼 배율을 올려 얇아 보이지 않게 보완
  mkFxAnim(sheet,fx,fy,ang,scale,duration);      // ② 본체
  mkFxAnim(sheet,fx,fy,ang,scale*0.82,duration); // ③ 코어 — 겹쳐서 두께감
}
function dealKatanaDamage(e,w,ang,dmgMulExtra){
  const d=WEAPONS[w.id];
  const R=d.range, half=d.arcWidth*0.5;
  const dmg=d.dmg*(w.dmgMul||1)*e.st.atk*(dmgMulExtra??1);
  const ex=e.x, ey=e.y-BASE_SIZE*0.45;
  const cand=queryMobs(ex,ey,R+60,_qKatana);
  for(let i=0;i<cand.length;i++){
    const m=cand[i]; if(m.dead) continue;
    const dx=m.x-ex, dy=(m.y+(m.hy||0))-ey;
    const dist=Math.hypot(dx,dy);
    if(dist>R+m.r) continue;
    let da=Math.abs(((Math.atan2(dy,dx)-ang+Math.PI*3)%TAU)-Math.PI);
    /* 아주 가까이 붙은 적은 각도 제한을 풀어서 반드시 맞는다 */
    if(dist<BASE_SIZE*0.8 || da<=half) hurt(m,dmg,e.st.crit,e.st.cdmg);
  }
}
function fireKatana(e,w){
  if(w.cuts==null) w.cuts=WEAPONS[w.id].cuts;
  const base=slashBaseAngle(e);
  const spd=w.chargeMul||1; // 업글할수록 chargeMul이 작아짐 = 스윙도 그만큼 빨라짐
  w.slashQueue=[];
  for(let i=0;i<w.cuts;i++){
    w.slashQueue.push({ang:base+SLASH_OFFSETS[i], start:i*SW_STEP*spd, fired:false, done:false});
  }
  w.slashT=0; w.swinging=true;
  return true;
}
/* 진행 중인 베기 중 가장 최근(뒤쪽) 것을 우선한다 — 겹치는 구간에서 다음 동작으로 자연스럽게 이어진다 */
function currentKatanaPose(w){
  let cur=null;
  for(const s of w.slashQueue){
    const t=(w.slashT-s.start)/(w.chargeMul||1);
    if(t>=0 && t<SW_TOTAL) cur={t,ang:s.ang,s};
  }
  return cur;
}
function updateKatana(e,w,dt){
  if(!w.swinging) return;
  w.slashT+=dt;
  const d=WEAPONS[w.id];
  const spd=w.chargeMul||1;
  for(const s of w.slashQueue){
    if(s.done) continue;
    const t=(w.slashT-s.start)/spd;
    if(t<0) continue;
    if(t>=SW_UP && !s.fired){ // 들어올림이 끝나고 내려침이 시작되는 순간 — 칼과 이펙트가 붙어 보이도록 딱 이 타이밍에 맞춘다
      s.fired=true;
      dealKatanaDamage(e,w,s.ang);
      spawnSlashFx(e,w,s.ang);
      AudioMgr.play(d.snd,0.85);
      shake=Math.max(shake,e.isPlayer?3.2:0);
      e.lungeX=Math.cos(s.ang)*BASE_SIZE*0.18; e.lungeY=Math.sin(s.ang)*BASE_SIZE*0.18;
    }
    if(t>=SW_TOTAL) s.done=true;
  }
  if(w.slashQueue.every(s=>s.done)){ w.swinging=false; w.phase='charge'; w.gauge=0; }
}
/* 토네이도 단계별 반경 배율·틱 간격·데미지 배율 (레벨 1~4) */
const TORNADO_LV=[
  {radiusMul:1.00, tickGap:0.085, dmgMul:1.00},
  {radiusMul:1.10, tickGap:0.078, dmgMul:1.15},
  {radiusMul:1.20, tickGap:0.071, dmgMul:1.32},
  {radiusMul:1.32, tickGap:0.064, dmgMul:1.52},
];
/* 토네이도 지름 = 화면 짧은 변의 0.86배 — 회전 무기와 같은 방식으로 화면 기준 크기를 잡는다(기기마다 화면을 벗어나지 않게) */
function tornadoSize(lv){
  const t=TORNADO_LV[clamp((lv||1)-1,0,TORNADO_LV.length-1)];
  return Math.min(W,H)*0.86*t.radiusMul;
}
/* 시전(0~cast) → 진행(3겹 회전+솟구치는 입자) → 타격(칼자국) → 종료(충격파) 4단계로 무게감을 준다 */
function fireBloodTornado(e,w){
  const d=WEAPONS.bloodkatana;
  w.tornado={t:0, dur:d.tornadoDur, lv:w.tornadoLv||1, tick:0, cast:0.18, burst:false, pAcc:0};
  G.flash={c:'255,40,60', t:0, life:0.16};
  shake=Math.max(shake,e.isPlayer?7:3);
  AudioMgr.play('katana',1.0);
}
/* 발밑에서 위로 빨려 올라가는 붉은 입자 */
function spawnTornadoParticles(e,s,dt){
  s.pAcc=(s.pAcc||0)+dt*70;
  const R=tornadoSize(s.lv)*0.5;
  while(s.pAcc>1){
    s.pAcc--;
    if(G.tParts.length>=180) G.tParts.shift();
    const a=Math.random()*TAU, r=R*(0.35+Math.random()*0.6);
    G.tParts.push({
      ang:a, rad:r, y:0,
      vy:-BASE_SIZE*(2.2+Math.random()*2.6),
      spin:-(3.0+Math.random()*2.5),
      t:0, life:0.34+Math.random()*0.26,
      s:BASE_SIZE*(0.05+Math.random()*0.07),
      cx:e.x, cy:e.y-BASE_SIZE*0.35,
    });
  }
}
function updateBloodTornado(e,w,dt){
  const s=w.tornado; if(!s) return;
  s.t+=dt;
  const lvInfo=TORNADO_LV[clamp(s.lv-1,0,TORNADO_LV.length-1)];
  if(s.t>=s.cast){
    spawnTornadoParticles(e,s,dt);
    s.tick-=dt;
    if(s.tick<=0){
      s.tick+=lvInfo.tickGap;
      const d=WEAPONS.bloodkatana;
      const R=tornadoSize(s.lv)*0.5;
      const dmg=d.dmg*(w.dmgMul||1)*e.st.atk*d.tornadoDmgRatio*lvInfo.dmgMul;
      const cx=e.x, cy=e.y-BASE_SIZE*0.35;
      const cand=queryMobs(e.x,e.y,R+60,_qTornado);
      const hitList=[];
      for(let i=0;i<cand.length;i++){
        const m=cand[i]; if(m.dead) continue;
        const dx=m.x-cx, dy=((m.y+(m.hy||0))-cy)/0.78; // 그리기의 세로 눌림(scale(1,0.78))과 같은 비율로 판정도 눌러야 보이는 대로 맞는다
        if(Math.hypot(dx,dy) < R+m.r){ hurt(m,dmg,e.st.crit,e.st.cdmg); hitList.push(m); }
      }
      for(const m of hitList.slice(0,4)){ // 최대 4개만 — 너무 많으면 지저분하다
        addFx({k:'slashMark', x:m.x, y:m.y+(m.hy||0), ang:Math.random()*TAU, life:0.22, len:BASE_SIZE*(0.5+Math.random()*0.4)});
      }
      if(hitList.length) shake=Math.max(shake,2.6);
      AudioMgr.play('katana',0.55);
    }
    /* 종료 — 바깥으로 충격파가 퍼지며 마무리 한 방 */
    if(s.t>=s.dur*0.88 && !s.burst){
      s.burst=true;
      const d=WEAPONS.bloodkatana;
      const R=tornadoSize(s.lv)*0.5;
      const finalDmg=d.dmg*(w.dmgMul||1)*e.st.atk*d.tornadoDmgRatio*lvInfo.dmgMul*1.5;
      addFx({k:'bloodRing', x:e.x, y:e.y-BASE_SIZE*0.35, r0:R*0.5, r1:R*1.35, life:0.38});
      areaDmg(e.x, e.y-BASE_SIZE*0.35, R, finalDmg, '#ff2b4d', e.st.crit, e.st.cdmg);
      shake=Math.max(shake,e.isPlayer?9:4);
      AudioMgr.play('katana',1.0);
    }
  }
  if(s.t>=s.dur){ w.tornado=null; w.tornadoCd=WEAPONS.bloodkatana.tornadoCd; }
}
function drawTornadoCast(e,s){
  const p=s.t/s.cast; // 0 -> 1
  const R=tornadoSize(s.lv)*0.5;
  const cy=e.y-BASE_SIZE*0.35;

  /* 발밑 마법진 — 빠르게 그려지며 나타난다 */
  ctx.save();
  ctx.translate(e.x,e.y);
  ctx.scale(1,0.34);
  ctx.rotate(-s.t*5.0);
  ctx.strokeStyle='rgba(255,50,80,'+(0.85*p)+')';
  ctx.lineWidth=BASE_SIZE*0.09;
  ctx.beginPath(); ctx.arc(0,0,R*0.72*p,0,TAU*p); ctx.stroke();
  ctx.strokeStyle='rgba(255,150,170,'+(0.55*p)+')';
  ctx.lineWidth=BASE_SIZE*0.04;
  ctx.beginPath(); ctx.arc(0,0,R*0.52*p,0,TAU*p); ctx.stroke();
  ctx.restore();

  /* 바깥에서 안쪽으로 빨려드는 붉은 선 — 힘이 모이는 느낌 */
  ctx.save();
  ctx.strokeStyle='rgba(255,60,90,'+(0.6*p)+')';
  ctx.lineWidth=BASE_SIZE*0.05;
  for(let i=0;i<10;i++){
    const a=i/10*TAU+s.t*3;
    const r0=R*(1.25-p*0.75), r1=r0-R*0.30;
    ctx.beginPath();
    ctx.moveTo(e.x+Math.cos(a)*r0, cy+Math.sin(a)*r0*0.78);
    ctx.lineTo(e.x+Math.cos(a)*r1, cy+Math.sin(a)*r1*0.78);
    ctx.stroke();
  }
  ctx.restore();
}
function drawTornadoBody(e,s){
  const k=(s.t-s.cast)/(s.dur-s.cast);
  const fr=Math.min(17,Math.floor(k*18));
  const size=tornadoSize(s.lv);
  const a=k<0.82?1:1-(k-0.82)/0.18;
  const cy=e.y-BASE_SIZE*0.35;

  /* 바닥 소용돌이 — 지면에 붙은 느낌(캐릭터보다 먼저 그려 아래 깔린다) */
  ctx.save();
  ctx.globalAlpha=a*0.55;
  ctx.translate(e.x,e.y);
  ctx.scale(1,0.30);
  ctx.rotate(-s.t*2.2);
  ctx.strokeStyle='rgba(255,40,70,0.6)';
  ctx.lineWidth=BASE_SIZE*0.10;
  ctx.beginPath();
  for(let i=0;i<3;i++){
    const r=size*0.5*(0.42+i*0.20);
    ctx.arc(0,0,r,i*1.1,i*1.1+Math.PI*1.4);
  }
  ctx.stroke();
  ctx.restore();

  /* 3겹 — 회전 속도·크기·알파를 다르게 겹쳐서 두께와 깊이를 준다 */
  const layers=[
    {sc:1.18, sp:-2.4, al:0.35}, // 바깥 — 느리게, 흐리게
    {sc:1.00, sp:-3.4, al:1.00}, // 본체
    {sc:0.78, sp:-4.8, al:0.65}, // 안쪽 — 빠르게
  ];
  for(const L of layers){
    ctx.save();
    ctx.globalAlpha=a*L.al;
    ctx.translate(e.x,cy);
    ctx.rotate(s.t*L.sp); // 음수 = 반시계
    ctx.scale(1,0.78);
    drawEffectFrame(FX_SHEETS.bloodSkill, fr, 0, 0, size*L.sc, size*L.sc, 0);
    ctx.restore();
  }
}
function drawBloodTornado(e,w){
  const s=w.tornado; if(!s) return;
  ctx.globalAlpha=fxOpacity;
  if(s.t<s.cast) drawTornadoCast(e,s);
  else drawTornadoBody(e,s);
  ctx.globalAlpha=1;
}
function updateTornadoParticles(dt){
  for(const p of G.tParts){ p.t+=dt; p.y+=p.vy*dt; }
  compact(G.tParts,_tPartAlive);
}
function drawTornadoParticles(){
  ctx.save();
  for(const p of G.tParts){
    const k=p.t/p.life;
    const a=(1-k)*0.9*fxOpacity;
    const ang=p.ang+p.spin*p.t;
    const rad=p.rad*(1-k*0.35); // 위로 갈수록 안쪽으로 모임
    const x=p.cx+Math.cos(ang)*rad;
    const y=p.cy+Math.sin(ang)*rad*0.78+p.y;
    ctx.globalAlpha=a;
    ctx.fillStyle=k<0.5?'#ff3a5c':'#ffb0be';
    ctx.beginPath(); ctx.ellipse(x,y,p.s,p.s*2.0,ang,0,TAU); ctx.fill();
  }
  ctx.restore();
}
/* 시전 시작 순간의 붉은 화면 번쩍임 — 화면 공간에 그린다(카메라 변환 밖) */
function drawTornadoFlash(){
  const f=G.flash; if(!f) return;
  const k=f.t/f.life; if(k>=1) return;
  ctx.fillStyle='rgba('+f.c+','+((1-k)*0.28)+')';
  ctx.fillRect(0,0,W,H);
}
/* 일반 카타나: 베기 1→2→3→4, 그 다음부터 데미지·충전 강화(상한 없음) */
function katanaUpgrade(w){
  const d=WEAPONS[w.id];
  if(w.cuts==null) w.cuts=d.cuts;
  if(w.cuts<d.maxCuts){ w.cuts++; return '베기 +1회'; }
  w.dmgMul=(w.dmgMul||1)*1.22;
  w.chargeMul=Math.max(0.40,(w.chargeMul||1)*0.86);
  return '데미지 +22% · 충전 -14%';
}
/* 블러드 카타나: 베기 2→3→4(4에서 토네이도 해금)→토네이도 강화 Lv1~4, 그 다음부터 데미지·충전 강화 */
function bloodUpgrade(w){
  const d=WEAPONS.bloodkatana;
  if(w.cuts==null) w.cuts=d.cuts;

  if(!w.tornadoLv) w.tornadoLv=1;
  if(w.tornadoLv<4){ w.tornadoLv++; return '토네이도 강화 Lv'+w.tornadoLv; }
  w.dmgMul=(w.dmgMul||1)*1.22;
  w.chargeMul=Math.max(0.40,(w.chargeMul||1)*0.86);

}
function fireWeaponFor(e,w){
  const s=wStat(e,w), d=s.d;
  const isGun=GUN_WEAPONS.has(w.id);
  const gunSfxMul=isGun?allyGunSfxMul(e):1;
  if(d.kind==='chain') return fireLightning(e,w);
  if(d.kind==='katana'){
    const tg=nearest(e.x,e.y,s.range,null,!e.isPlayer);
    const ex=e.drawX??e.x, ey=(e.drawY??e.y)-BASE_SIZE*0.45;
    e.aimAngle = tg? Math.atan2((tg.y+(tg.hy||0))-ey,tg.x-ex) : (e.aimAngle??e.face);
    return fireKatana(e,w);
  }
  const tg=nearest(e.x,e.y,s.range,null,!e.isPlayer); if(!tg) return false;
  let ox=e.drawX??e.x, oy=e.drawY??e.y, ang, fx, fy;
  const chestOx=e.drawX??e.x, chestOy=(e.drawY??e.y)-BASE_SIZE*0.45;
  if(isGun){
    ang = e.gunAngle ?? (d.kind==='shot'?leadAim(chestOx,chestOy,tg,d.sp||400):Math.atan2((tg.y+(tg.hy||0))-chestOy,tg.x-chestOx));
    let hp;
    if(w.id==='revolver'){ w.rside=w.rside===1?-1:1; hp=revolverHandPos(e,BASE_SIZE,w.rside); } // 왼쪽·오른쪽 번갈아, 같은 적만
    else hp=gunHandPos(e,BASE_SIZE,ang);
    ox=hp.hx; oy=hp.hy;
    const mz=gunMuzzle(w.id,ox,oy,ang);
    fx=mz.mx; fy=mz.my;
  } else {
    ang = d.kind==='shot' ? leadAim(chestOx,chestOy,tg,d.sp||360) : Math.atan2((tg.y+(tg.hy||0))-chestOy,tg.x-chestOx);
    ox=chestOx; oy=chestOy;
    fx=ox; fy=oy;
  }
  e.aimAngle=ang;
  if(d.kind==='arc'){
    addFx({k:'arc',x:fx,y:fy,a:ang,r:s.range,c:d.c,life:.22});
    if(d.fxSheet) mkFxAnim(FX_SHEETS[d.fxSheet],fx,fy,ang,1.725,.42);
    for(const m of G.mobs){ if(m.dead)continue;
      const my=m.y+(m.hy||0);
      const dd=Math.hypot(m.x-fx,my-fy); if(dd>s.range+m.r)continue;
      let da=Math.atan2(my-fy,m.x-fx)-ang; da=Math.atan2(Math.sin(da),Math.cos(da));
      if(Math.abs(da)<1.05) hurt(m,s.dmg,e.st.crit,e.st.cdmg);
    }

    areaDmg(fx,fy,s.range,s.dmg,d.c,e.st.crit,e.st.cdmg);
  } else if(d.kind==='hitscan_cone'){
    AudioMgr.play(d.snd,gunSfxMul); mkAnchoredFx(FX_SHEETS[d.fx],fx,fy,ang,4,70,0.825,0.12);
    for(const m of G.mobs){ if(m.dead)continue;
      const my=m.y+(m.hy||0);
      const dd=Math.hypot(m.x-fx,my-fy); if(dd>s.range+m.r)continue;
      let da=Math.atan2(my-fy,m.x-fx)-ang; da=Math.atan2(Math.sin(da),Math.cos(da));
      if(Math.abs(da)<d.half){
        hurt(m,s.dmg,e.st.crit,e.st.cdmg);
        if(d.knockback && !m.boss && m.shape!=='golemite'){
          const ka=Math.atan2(m.y-fy,m.x-fx);
          m.kx=(m.kx||0)+Math.cos(ka)*d.knockback;
          m.ky=(m.ky||0)+Math.sin(ka)*d.knockback;
        }
      }
    }
  } else if(d.kind==='hitscan_line'){
    AudioMgr.play(d.snd,gunSfxMul);
    let hitDist=s.range;
    const dx=Math.cos(ang), dy=Math.sin(ang);
    for(const m of G.mobs){ if(m.dead)continue;
      const rx=m.x-fx, ry=(m.y+(m.hy||0))-fy, proj=rx*dx+ry*dy;
      if(proj<0||proj>s.range) continue;
      const perp=Math.abs(rx*dy-ry*dx);
      if(perp<m.r+14) hurt(m,s.dmg,e.st.crit,e.st.cdmg);
    }
    G.fxAnim.push({sheet:FX_SHEETS[d.fx],x:fx,y:fy,angle:ang,beam:true,len:hitDist,thick:1.65,t:0,duration:.32});
  } else {
    spawnProj(e,fx,fy,ang,s,d,gunSfxMul);
  }
  return true;
}
const ORBIT_WEAPONS=['crimsonfang','bluesteel']; // 회전 무기 목록 — 앞으로 늘어나도 아래 공통 상수를 같이 쓴다
const SPINNER_MAX=6;
/* 궤도 반경 = 화면 짧은 변의 1/4. 기기 해상도가 달라져도 항상 같은 비율로 화면 안에 들어온다 */
function orbitRadius(n){
  const base=Math.min(W,H)*0.25;
  const grow=1+Math.min(4,n-1)*0.06; // 날이 많아질 때만 살짝 넓힘
  return clamp(base*grow, BASE_SIZE*1.6, BASE_SIZE*3.0);
}
const SPINNER_VISUAL_MUL=1.10; // 블루 스틸·크림슨 팽의 공전 거리는 유지하고 화면에 보이는 크기만 10% 확대
function spinnerSize(n){ return orbitRadius(n)*0.26; } // 판정 크기와 공전 반경은 기존 값을 유지
const CRIMSON_SLOW_MUL=0.5, CRIMSON_SLOW_HOLD=0.15; // 크림슨 팽 — 날에 닿아있는 동안만 이동속도 절반. 지속 디버프 아님(0.15초 안에 자연히 풀림)
function updateSpinner(e,w,dt){
  const d=WEAPONS[w.id];
  const n=Math.min(SPINNER_MAX,2+w.lv); // 3개로 시작, 강화마다 +1, 최대 6개. 그 이후는 속도·피해량만 증가
  const R=orbitRadius(n), sz=spinnerSize(n), hitR=sz*0.55; // 보이는 날 크기에 맞춘 판정
  const spd=d.orbitSpd*(1+0.18*(w.lv-1));
  const dmg=d.dmg*(1+.35*(w.lv-1))*e.st.atk; // 강화할수록 피해량도 함께 증가
  w.ang=(w.ang||0)+spd*dt; // atan2(Y-down) 각 증가 = 화면상 시계방향
  w.orbs=w.orbs||[];
  for(let i=0;i<n;i++){
    const a=w.ang+i*(Math.PI*2/n);
    const ox=e.x+Math.cos(a)*R, oy=e.y+Math.sin(a)*R;
    const orb=w.orbs[i]=w.orbs[i]||{cd:0,anim:0};
    orb.x=ox; orb.y=oy; orb.sz=sz; orb.ang=a; orb.orbitR=R; orb.orbitSpd=spd; orb.anim+=dt*20; orb.cd-=dt;
    if(orb.cd<=0){
      for(const m of G.mobs){ if(m.dead)continue;
        if(Math.hypot(m.x-ox,(m.y+(m.hy||0))-oy)<m.r+hitR){ hurt(m,dmg,e.st.crit,e.st.cdmg); orb.cd=.35; break; }
      }
    }
    if(w.id==='crimsonfang'){ // 데미지 쿨다운과 무관하게, 닿아있는 동안은 매 프레임 계속 느려지게 갱신
      for(const m of G.mobs){ if(m.dead)continue;
        if(Math.hypot(m.x-ox,(m.y+(m.hy||0))-oy)<m.r+hitR) m.slowT=CRIMSON_SLOW_HOLD;
      }
    }
  }
  w.orbs.length=n;
}
/* 손 위치 = 가슴 높이(스프라이트 위에서 58% 지점 = 아래서 42% 지점), 좌우는 적이 있는 쪽 어깨.
   뒷모습일 때 총이 등 한가운데 납작하게 붙지 않도록, 조준 방향(aim)의 좌/우로 갈라놓는다. */
function gunHandPos(e,spriteSize,aim){
  spriteSize=spriteSize||BASE_SIZE;
  const bs=BODY_SCALE[e.char]||{w:1,h:1}; // 체형이 넓어진 만큼(보리스) 손 위치도 같이 밀어줘야 몸 안쪽에 파묻히지 않는다
  const fwd=handFwd(aim??0);
  return {hx:(e.drawX??e.x)+fwd*spriteSize*HAND_GUN.fwd*bs.w, hy:(e.drawY??e.y)-spriteSize*HAND_GUN.up*bs.h};
}
function updateMemberCombat(e,dt){
  if(e.lungeX||e.lungeY){ // 카타나 타격 시 앞으로 살짝 밀린 느낌 — 0.1초 정도에 걸쳐 원위치
    const damp=Math.pow(0.02,dt/0.1);
    e.lungeX=(e.lungeX||0)*damp; e.lungeY=(e.lungeY||0)*damp;
    if(Math.abs(e.lungeX)<0.05) e.lungeX=0;
    if(Math.abs(e.lungeY)<0.05) e.lungeY=0;
  }
  let nearGun=null;
  for(const w of e.weapons){
    const d=WEAPONS[w.id];
    if(d.kind==='orbit'){ updateSpinner(e,w,dt); continue; }
    if(GUN_WEAPONS.has(w.id)) nearGun=w.id;
    if(d.kind==='katana'){
      // 진행 중인 베기/토네이도 애니메이션은 게이지 상태와 무관하게 계속 갱신한다
      if(w.swinging) updateKatana(e,w,dt);
      if(w.tornado) updateBloodTornado(e,w,dt);
      if(!w.swinging && !w.tornado){
        if(d.tornado && (w.cuts??d.cuts)>=d.maxCuts){ // 4단계를 채우면 별도 쿨타임으로 토네이도가 주기적으로 나간다
          w.tornadoCd=(w.tornadoCd??d.tornadoCd)-dt;
          if(w.tornadoCd<=0){
            const tg=nearest(e.x,e.y,d.range*1.3,null,!e.isPlayer);
            e.aimAngle = tg? Math.atan2((tg.y+(tg.hy||0))-(e.drawY??e.y),tg.x-(e.drawX??e.x)) : (e.aimAngle??e.face);
            fireBloodTornado(e,w);
          }
        }
        w.gauge=Math.min(1,(w.gauge||0)+dt*e.st.aspd/(d.chargeBase*(w.chargeMul||1)));
        // 다 찬 뒤에도 몬스터가 없으면 대기만 한다 — 안 보인다고 게이지를 다시 채우지 않는다
        if(w.gauge>=1 && nearest(e.x,e.y,d.range,null,!e.isPlayer)){ w.gauge=0; fireWeaponFor(e,w); shake=Math.max(shake,e.isPlayer?1.5:0); }
      }
      continue;
    }
    if(d.gauge && d.fireDur){
      // 미니건·기관총·라이플·리볼버 — 게이지가 차면 fireDur초 동안 계속 쏜다.
      // 몬스터가 안 보인다고 게이지를 다시 채우게 하지 않는다 — 다 찬 상태로 대기하다 몬스터가 나타나면 그때 쏘고, 그 이후에야 fireT가 줄어든다
      if(w.phase==='fire'){
        const hasTarget=nearest(e.x,e.y,d.range,null,!e.isPlayer)!=null;
        if(hasTarget){
          w.fireT-=dt;
          w.cd=(w.cd||0)-dt;
          while(w.cd<=0){ fireWeaponFor(e,w); w.cd+=d.cdBase/e.st.aspd; }
          if(w.fireT<=0){ w.phase='charge'; w.gauge=0; }
        }
      } else {
        w.gauge=Math.min(1,(w.gauge||0)+dt*e.st.aspd/(d.chargeBase*(w.chargeMul||1)));
        if(w.gauge>=1){ w.phase='fire'; w.fireT=d.fireDur; w.cd=0; shake=Math.max(shake,e.isPlayer?2:0); }
      }
    } else if(d.gauge){
      w.gauge=Math.min(1,(w.gauge||0)+dt*e.st.aspd/(d.chargeBase*(w.chargeMul||1)));
      if(w.gauge>=1){ if(fireWeaponFor(e,w)){ w.gauge=0; shake=Math.max(shake,e.isPlayer?2:0); } }
    } else {
      w.cd=(w.cd||0)-dt;
      if(w.cd<=0){
        let cdBase=d.cdBase;
        if(w.id==='lightning') cdBase=Math.max(0.9,d.cdBase-0.22*(w.lv-1));
        else cdBase=cdBase*(1-0.04*(w.lv-1));
        if(fireWeaponFor(e,w)){ w.cd=cdBase/e.st.aspd; if(e.isPlayer) shake=Math.max(shake,1); }
        else w.cd=0.12;
      }
    }
  }
  e.activeGun=nearGun;
  if(nearGun){
    const wd=WEAPONS[nearGun];
    const tg=nearest(e.x,e.y,600,null,!e.isPlayer);
    const ox=e.drawX??e.x, oy=(e.drawY??e.y)-BASE_SIZE*0.45; // 가슴 높이 — 발밑에서 쏘는 것처럼 보이면 안 된다
    let target;
    if(tg) target = wd.kind==='shot' ? leadAim(ox,oy,tg,wd.sp||400) : Math.atan2((tg.y+(tg.hy||0))-oy,tg.x-ox);
    else target=e.face;
    if(e.gunAngle==null) e.gunAngle=target;
    e.gunAngle=e.gunAngle+angDiff(target,e.gunAngle)*Math.min(1,dt*12); // 즉시 스냅하지 않고 부드럽게 회전
  } else e.gunAngle=null;
}

const NUKE={ active:false, phase:'', t:0, count:5, countStep:1.0, dotStep:0.25 }; // 5초 타이머 — 5,4,3,2,1 표시 후 폭발

function fireNuke(){

function updateNuke(dt){

function detonate(){

      }
    } else {
      const d=m.hp;
      killMob(m);
      /* 핵으로 죽은 화면 안의 몬스터는 전부 피해 숫자를 띄운다. 5마리마다 초강타 배지로 리듬을 준다. */
      if(visible){
        const mega=shown%5===0;
        pushDmgText(m.x+rnd(-8,8),m.y-m.r-4,d,mega,1,{forceTier:mega?'mega':'big',delay:shown*0.010});
        shown++;
      }
    }
  }
  G.spawnT=Math.max(G.spawnT,3); // 폭발 후 3초간 재스폰 정지

}

function drawNukeBoom(){

    }

    ctx.beginPath(); ctx.arc(f.x,f.y,R*(0.18+p*0.35),0,TAU); ctx.fill();
  }
}

const R={com:{n:'일반',c:'#9db4d6'},rare:{n:'희귀',c:'#5fb8ff'},epic:{n:'영웅',c:'#c084fc'},leg:{n:'전설',c:'#ffb020'}};
function buildPool(isBox,who){
  who=who||G.player;
  const P=[], st=who.st, T=G.tower;
  const add=(w,o)=>{o.w=w;P.push(o);};
  add(10,{r:'com',t:'공격력 강화',s:'모든 피해량 +18%',ic:'🗡',f:()=>st.atk*=1.18});
  add(10,{r:'com',t:'공격 속도 증가',s:'재사용 대기시간 -15%',ic:'⏱',f:()=>st.aspd*=1.15});
  add(8, {r:'rare',t:'치명타 확률',s:`치명타 +7% (현재 ${Math.round(st.crit*100)}%)`,ic:'✧',f:()=>st.crit=Math.min(.75,st.crit+.07)});
  add(6, {r:'rare',t:'치명타 피해',s:'치명타 배율 +30%',ic:'✵',f:()=>st.cdmg+=.3});
  add(9, {r:'com',t:'체력 증가',s:'최대 체력 +30 · 즉시 회복',ic:'❤',f:()=>{who.maxHp+=30;who.hp=Math.min(who.maxHp,who.hp+45);}});
  add(7, {r:'com',t:'이동 속도',s:'이동 속도 +9%',ic:'👟',f:()=>who.speed*=1.09});
  if(who.isPlayer) add(5, {r:'com',t:'자력 강화',s:'경험치 수집 범위 +35%',ic:'🧲',f:()=>st.pickup*=1.35});
  add(6, {r:'rare',t:'재생',s:'초당 체력 +0.8 회복',ic:'✚',f:()=>st.regen+=.8});
  if(T && who.isPlayer){
    add(7, {r:'rare',t:'코어 수리',s:'코어 체력 35% 회복',ic:'🔧',f:()=>T.hp=Math.min(T.maxHp,T.hp+T.maxHp*.35)});
    add(6, {r:'rare',t:'보호막',s:'코어 보호막 +220',ic:'🛡',f:()=>{T.maxShield+=220;T.shield+=220;}});
    add(5, {r:'com',t:'코어 보강',s:'코어 최대 체력 +300 · 회복',ic:'🏰',f:()=>{T.maxHp+=300;T.hp+=300;}});
  }
  if(who.isPlayer) add(3, {r:'com',t:'전리품',s:'골드 +250',ic:'🪙',f:()=>G.gold+=250});

  // 보조공격 — 전부 히든상자 전용 신규획득. 총기는 절대 나오지 않는다.
  const own=new Set(who.weapons.map(w=>w.id));
  if(isBox && who.weapons.length<7) for(const k of AUX_WEAPONS){
    if(own.has(k)) continue;
    const d=WEAPONS[k];
    if(d.exclGroup){
      // 블루 스틸 · 크림슨 팽은 같은 계열 — 하나만 보유. 더 강한 쪽을 얻으면 기존 것을 대체한다
      const ownedSame=who.weapons.find(w=>WEAPONS[w.id].exclGroup===d.exclGroup);
      if(ownedSame){
        if(WEAPONS[ownedSame.id].exclTier>=d.exclTier) continue; // 이미 더 강하거나 같은 것 보유중
        add(9,{r:'epic',t:`신규 보조공격 · ${d.n}`,s:(d.d||'')+` — 기존 ${WEAPONS[ownedSame.id].n} 대체`,ic:d.ic,col:d.c,
          f:()=>{ const idx=who.weapons.indexOf(ownedSame); who.weapons.splice(idx,1); who.weapons.push({id:k,lv:1,cd:0,gauge:0}); }});
        continue;
      }
    }
    add(9,{r:'epic',t:`신규 보조공격 · ${d.n}`,s:d.d||'새 보조공격 획득',ic:d.ic,col:d.c,f:()=>who.weapons.push({id:k,lv:1,cd:0,gauge:0})});
  }
  // 무기 개조 — 히든상자 전용, 보유 총의 데미지와 충전 시간을 동시에 강화
  if(isBox && who.weapons.some(w=>GUN_WEAPONS.has(w.id))){
    add(6,{r:'rare',t:'무기 개조',s:'데미지 +25% · 충전 시간 -18%',ic:'🔧',f:()=>{
      const w=who.weapons.find(x=>GUN_WEAPONS.has(x.id));
      if(!w) return;
      w.dmgMul=(w.dmgMul||1)*1.25;
      w.chargeMul=Math.max(0.35,(w.chargeMul||1)*0.82);
    }});
  }
  // 핵폭탄 — 히든상자 전용, 즉시발동이 아니라 아이템칸에 보관. 너무 흔해지지 않게 최대 3개로 제한
  if(isBox && who.isPlayer && (G.nukeCount||0)<3){
    add(4,{r:'epic',t:'핵폭탄',s:'화면의 일반 몹 전멸 · 보스 체력 30% 감소. 아이템 칸에 보관했다 원할 때 사용',ic:'☢',col:'#ff5a3c',f:()=>{
      G.nukeCount=(G.nukeCount||0)+1; updateItemSlot();
    }});
  }
  // 미니건 — 히든상자 전용, 들고 있던 주무기를 완전히 대체한다
  if(isBox && !who.weapons.some(w=>w.id==='minigun')){
    add(7,{r:'epic',t:'미니건',s:'현재 무기를 미니건으로 교체',ic:'⛭',col:'#ff3b30',f:()=>giveMainWeapon(who,'minigun')});
  }
  // 블러드 카타나 — 히든상자 전용, 들고 있던 주무기를 완전히 대체한다
  if(isBox && !who.weapons.some(w=>w.id==='bloodkatana')){
    add(7,{r:'epic',t:'블러드 카타나',s:'현재 무기를 블러드 카타나로 교체',ic:'🩸',col:'#ff2b4d',f:()=>giveMainWeapon(who,'bloodkatana')});
  }
  for(const w of who.weapons){
    const d=WEAPONS[w.id];
    if(d.kind==='katana'){ // 카타나는 w.lv가 아니라 cuts→(블러드는 토네이도 Lv도)→dmgMul/chargeMul 순으로 자체 강화한다(상한 없음)
      if(w.cuts==null) w.cuts=d.cuts;
      const isBlood=w.id==='bloodkatana';
      if(isBlood && !w.tornadoLv) w.tornadoLv=w.cuts>=4?1:0;
      let desc;
      if(w.cuts<4) desc = w.cuts+1===4 && isBlood ? '베기 +1회 (블러드 토네이도 해금)' : '베기 +1회';
      else if(isBlood && w.tornadoLv<4) desc='토네이도 강화 Lv'+(w.tornadoLv+1);
      else desc='데미지 +22% · 충전 시간 -14%';
      add(11,{r:'rare',t:`${d.n} 강화`,s:desc,ic:d.ic,col:d.c,f:()=>isBlood?bloodUpgrade(w):katanaUpgrade(w)});
      continue;
    }
    if(w.lv<8 || d.kind==='orbit'){ // 공전형(블루 스틸·크림슨 팽)은 상한 없이 계속 강화 가능(회전 속도 무제한 증가)
      const desc = d.kind==='orbit' ? '개수(최대 6개) · 공전 속도 · 피해량 증가' : '피해량 +38% · 재사용 대기시간 감소';
      add(11,{r:'rare',t:`${d.n} 강화 Lv.${w.lv+1}`,s:desc,ic:d.ic,col:d.c,f:()=>w.lv++});
    }
  }
  if(!isBox){
    const allOwned=[...who.pets,...who.ownedPets];
    const ownedSpecies=new Set(allOwned.map(p=>p.k));
    const newSpecies=Object.keys(PETS).filter(k=>!ownedSpecies.has(k));
    if(newSpecies.length){
      const k=pick(newSpecies), d=PETS[k];
      add(9,{r:'epic',t:`${d.n} 획득`,s:d.d+' (자동 장착 · 인벤토리에서 교체 가능)',ic:'🐾',col:'#9dd6ff',guaranteed:true,
        f:()=>{
          const pt={k,lv:1,cd:0,x:who.x,y:who.y};
          if(who.pets.length<MAX_ACTIVE_PETS) who.pets.push(pt);
          else who.ownedPets.push(pt);
        }});
    } else if(allOwned.length){
      // 펫을 이미 하나라도 갖고 있으면 그 뒤로도 업그레이드 선택지가 계속 나오도록 보장한다 (강제 포함)
      const tgt=pick(allOwned), d=PETS[tgt.k];
      add(9,{r:'epic',t:`${d.n} 강화 Lv.${tgt.lv+1}`,s:'공격력 · 회복량 +30%',ic:'🐾',col:'#9dd6ff',guaranteed:true,f:()=>tgt.lv++});
    }
  }
  return P;
}
function rollChoices(n,isBox,who){
  const P=buildPool(isBox,who), out=[];
  // 보장 항목(펫 신규획득/업그레이드 등)은 뽑기 전에 먼저 강제로 포함시킨다
  for(let i=P.length-1;i>=0 && out.length<n;i--) if(P[i].guaranteed) out.push(P.splice(i,1)[0]);
  let tot=P.reduce((a,b)=>a+b.w,0);
  for(let i=out.length;i<n && P.length;i++){
    let r=Math.random()*tot, idx=0;
    for(let j=0;j<P.length;j++){ r-=P[j].w; if(r<=0){idx=j;break;} idx=j; }
    tot-=P[idx].w; out.push(P.splice(idx,1)[0]);
  }
  return out;
}
function recordPlayerChoice(c){
  if(!G||!c) return;
  const log=G.pickLog||(G.pickLog={total:0,items:{},weapons:{},pets:{}});
  log.total++;
  const title=c.t.replace(/ Lv\.\d+$/,'');
  const weapon=Object.entries(WEAPONS).sort((a,b)=>b[1].n.length-a[1].n.length).find(([,d])=>title.includes(d.n));
  if(weapon && (title.includes('신규 보조공격')||title.includes('강화')||title===weapon[1].n)){
    log.weapons[weapon[0]]=(log.weapons[weapon[0]]||0)+1;
    return;
  }
  const pet=Object.entries(PETS).find(([,d])=>title.includes(d.n));
  if(pet && (title.includes('획득')||title.includes('강화'))){
    log.pets[pet[0]]=(log.pets[pet[0]]||0)+1;
    return;
  }
  log.items[title]=(log.items[title]||0)+1;
}
/* AI 아군은 UI 없이 즉시 하나를 골라 적용한다 (히든 상자 · 성장 모두 동일) */
function autoResolveChoice(who,isBox){
  const cs=rollChoices(3,isBox,who);
  if(cs.length) pick(cs).f();
}
function openChoice(title,sub,isBox){
  state='choice';
  const cs=rollChoices(3,isBox,G.player);
  screens.className='on'; setScreenBg(OVERLAY_BG);
  screens.innerHTML=`<div class="panel">
    <div class="eyebrow">${sub}</div><div class="title" style="font-size:26px">${title}</div>
    <div class="cards">${cs.map((c,i)=>{
      const col=c.col||R[c.r].c;
      return `<button class="card" data-i="${i}" style="--c:${col}">
        <h4><span>${c.ic}</span>${c.t}<span class="tag" style="color:${R[c.r].c}">${R[c.r].n}</span></h4>
        <p>${c.s}</p></button>`;}).join('')}</div>
    <div class="hint">하나만 선택할 수 있습니다</div></div>`;
  screens.querySelectorAll('.card').forEach(b=>b.onclick=()=>{
    AudioMgr.play('btn');
    const choice=cs[+b.dataset.i]; choice.f(); recordPlayerChoice(choice); screens.className=''; screens.innerHTML='';
    if(G.pending>0){ G.pending--; openChoice('레벨 업','LEVEL '+G.level); }
    else { state='play'; last=performance.now(); }
  });
}
function gainXp(v){
  G.xp+=v;
  while(G.xp>=G.xpNeed){
    G.xp-=G.xpNeed; G.level++; G.xpNeed=Math.round(8+G.level*6.5+G.level**1.35);
    G.player.hp=Math.min(G.player.maxHp,G.player.hp+8);
    if(G.level%3!==0) continue; // 3레벨마다 한 번만 선택지
    if(state==='choice') G.pending++;
    else openChoice('레벨 업','LEVEL '+G.level);
  }
}

const stick={on:false,id:null,ox:0,oy:0,x:0,y:0};
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;
  stick.on=true; stick.id=e.pointerId; stick.ox=e.clientX; stick.oy=e.clientY;
  stick.x=e.clientX; stick.y=e.clientY; cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{ if(stick.on&&e.pointerId===stick.id){stick.x=e.clientX;stick.y=e.clientY;} });
const relStick=e=>{ if(e.pointerId===stick.id){stick.on=false;stick.id=null;} };
cv.addEventListener('pointerup',relStick); cv.addEventListener('pointercancel',relStick);

function inputVec(){
  let dx=0,dy=0;
  if(keys['a']||keys['arrowleft'])dx--; if(keys['d']||keys['arrowright'])dx++;
  if(keys['w']||keys['arrowup'])dy--;  if(keys['s']||keys['arrowdown'])dy++;
  if(stick.on){
    const vx=stick.x-stick.ox, vy=stick.y-stick.oy, l=Math.hypot(vx,vy);
    if(l>8){ const m=Math.min(1,l/62); dx=vx/l*m; dy=vy/l*m; }
  }
  const l=Math.hypot(dx,dy);
  return l>1?{x:dx/l,y:dy/l}:{x:dx,y:dy};
}

/* ---------------------- 팀원 공용: 다운/부활/피해 ---------------------- */
function livingMembers(){
  const arr=[]; if(!G.player.eliminated && G.player.down<=0) arr.push(G.player);
  for(const a of G.allies) if(!a.eliminated && a.down<=0) arr.push(a);
  return arr;
}
function damageMember(e,d){
  if(e.inv>0||e.down>0||e.eliminated) return;
  if(e.shield>0){ const abs=Math.min(e.shield,d); e.shield-=abs; d-=abs; addFx({k:'ring',x:e.x,y:(e.drawY??e.y),r0:BASE_SIZE*0.3,r1:BASE_SIZE*0.55,c:'#a58cff',life:.25}); if(d<=0) return; }
  e.hp-=d; e.inv=e.isPlayer?.45:.4; shake=Math.max(shake,e.isPlayer?5:2);
  e.lastHitT=G.time; // 자동회복 타이머 리셋
  if(e.isPlayer) addFx({k:'txt',x:e.x,y:e.y-24,txt:'-'+Math.round(d),c:'#ff6b8a',size:14,life:.6,vy:-40});
  if(e.hp<=0){
    e.hp=0;
    if(G.mode==='infinite'){
      e.lives--;
      if(e.lives>0){ e.down=20; addFx({k:'txt',x:e.x,y:e.y-40,txt:'부활까지 20초',c:'#ff6b8a',size:13,life:1.6,vy:-30}); }
      else { e.eliminated=true; e.down=0; if(e.isPlayer) gameOver('lives'); }
    } else {
      e.down=3.2;
    }
    addFx({k:'burst',x:e.x,y:e.y,c:'#ff6b8a',n:12,life:.5});
  }
}
function updateMemberDown(e,dt){
  if(e.down<=0 || e.eliminated) return;
  e.down-=dt;
  if(e.down<=0){
    let ax,ay;
    if(G.tower){ ax=G.tower.x+rnd(-40,40); ay=G.tower.y+60; }
    else { ax=WORLD/2+rnd(-60,60); ay=WORLD/2+rnd(-60,60); }
    e.x=ax; e.y=ay; e.hp=e.maxHp*(G.mode==='infinite'?0.75:0.5); e.inv=2.4;
    addFx({k:'ring',x:e.x,y:e.y,r0:4,r1:43,c:'#6ee7ff',life:.5});
  }
}
function damageTower(d){
  const T=G.tower; if(!T) return;
  if(T.shield>0){ const a=Math.min(T.shield,d); T.shield-=a; d-=a; }
  if(d>0) T.hp-=d;
  shake=Math.max(shake,4);
  if(T.hp<=0){ T.hp=0; gameOver('tower'); }
}

/* ---------------------- 자동 회복 ---------------------- */
const REGEN_CFG={delay:3, baseFrac:0.03, fairyMul:3.2}; // delay=피격 후 몇 초 뒤 시작, baseFrac=초당 최대체력 비율, fairyMul=요정 보유 시 배율
function hasFairy(e){ return (e.pets||[]).some(pt=>pt.k==='fairy'); }
function applyAutoRegen(e,dt){
  if(!e||e.hp<=0||e.eliminated||e.down>0) return;
  if(G.time-(e.lastHitT??-999) < REGEN_CFG.delay) return;
  const mul=hasFairy(e)?REGEN_CFG.fairyMul:1;
  e.hp=Math.min(e.maxHp, e.hp+e.maxHp*REGEN_CFG.baseFrac*mul*dt);
}
/* 체력바의 "깎인 만큼 하얗게 남았다 사라지는" 효과용 — 실제 hp보다 느리게 따라오는 표시값 */
function updateDispHp(e,dt){
  if(e.dispHp==null) e.dispHp=e.hp;
  if(e.hp>e.dispHp) e.dispHp=e.hp;
  else e.dispHp=Math.max(e.hp, e.dispHp-e.maxHp*1.3*dt);
}

/* ---------------------- 펫 (플레이어 · 아군 공용) ---------------------- */
function updatePetsFor(owner,pets,dt){
  const hasCrow=pets.some(pt=>pt.k==='crow');
  if(!hasCrow){ owner.shield=0; owner.shieldMax=0; owner.shieldRegenT=null; } // 까마귀를 빼면 방어막도 사라진다
  pets.forEach((pt,i)=>{
    const d=PETS[pt.k], ang=G.time*0.9+i*(Math.PI*2/Math.max(1,pets.length));
    const tx=owner.x+Math.cos(ang)*BASE_SIZE*0.85, ty=owner.y+Math.sin(ang)*BASE_SIZE*0.85;
    const px0=pt.x, py0=pt.y;
    pt.x+=(tx-pt.x)*Math.min(1,dt*6); pt.y+=(ty-pt.y)*Math.min(1,dt*6);
    if(Math.hypot(pt.x-px0,pt.y-py0)>0.01) pt.face=Math.atan2(pt.y-py0,pt.x-px0); // 공전 중에도 진행 방향으로 좌우반전
    const pcf=PET_MOTION[pt.k]||PET_MOTION.golem;
    pt._mt=(pt._mt||0)+dt*pcf.rate;
    const pFly=pcf.fly? PET_SIZE*(pcf.fly+Math.sin(pt._mt*0.42)*0.06) : 0;
    pt._m={
      bounce: Math.abs(Math.sin(pt._mt))*PET_SIZE*pcf.bounce+pFly,
      squashY: 1-Math.abs(Math.sin(pt._mt))*pcf.squash,
      squashX: 1,
      sway: Math.sin(pt._mt*0.5)*pcf.sway,
    };
    pt.lunge=Math.max(0,(pt.lunge||0)-dt*8); // 공격 시 튀어나갔다 돌아오는 모션의 감쇠
    const lv=pt.lv||1, lvMul=1+0.3*(lv-1), cdMul=1/(1+0.15*(lv-1)); // 레벨업 = 전부 쿨타임 감소, 울프는 데미지도 추가로
    const dmg=(d.dmg||0)*owner.st.atk*lvMul;

    if(d.kind==='shield'){
      owner.shieldMax=Math.round(d.shieldBase*lvMul);
      if(owner.shield<=0){
        owner.shieldRegenT=(owner.shieldRegenT??(d.cd*cdMul))-dt;
        if(owner.shieldRegenT<=0){
          owner.shield=owner.shieldMax; owner.shieldRegenT=null;
          addFx({k:'ring',x:owner.x,y:(owner.drawY??owner.y),r0:2,r1:BASE_SIZE*0.55,c:d.c,life:.4});
        }
      } else { owner.shieldRegenT=null; owner.shield=Math.min(owner.shield,owner.shieldMax); }
      return;
    }
    if(d.kind==='push'){
      pt.cd=(pt.cd==null?0:pt.cd)-dt; if(pt.cd>0) return;
      pt.cd=d.cd*cdMul; pt.lunge=1;
      const R=d.pushR;
      let hit=false;
      const cand=queryMobs(owner.x,owner.y,R+60,_qPet);
      for(let i=0;i<cand.length;i++){ const m=cand[i]; if(m.dead)continue; const dd=dist(m,owner); if(dd<R && dd>0.01){
        const a2=Math.atan2(m.y-owner.y,m.x-owner.x), push=d.pushForce*(1-dd/R)+40;
        /* ★ 순간이동처럼 보이지 않게 즉시 위치를 옮기지 않고, 샷건 넉백과 같은 감쇠 속도로 밀어낸다 */
        m.kx=(m.kx||0)+Math.cos(a2)*push*4; m.ky=(m.ky||0)+Math.sin(a2)*push*4;
        hit=true;
      }}
      addFx({k:'ring',x:owner.x,y:owner.y,r0:5,r1:R,c:d.c,life:.4});
      if(hit) shake=Math.max(shake,3);
      return;
    }

    pt.cd=(pt.cd==null?0:pt.cd)-dt; if(pt.cd>0)return;
    if(d.kind==='heal'){
      pt.cd=d.cd*cdMul; owner.hp=Math.min(owner.maxHp,owner.hp+d.heal*lvMul);
      if(owner.isPlayer && G.tower) G.tower.hp=Math.min(G.tower.maxHp,G.tower.hp+d.heal*lvMul*1.5);
      addFx({k:'ring',x:pt.x,y:pt.y,r0:3,r1:33,c:d.c,life:.4}); pt.lunge=1; return;
    }
    const t=nearest(pt.x,pt.y,d.range,null,!owner.isPlayer); if(!t){pt.cd=.12;return;}
    pt.cd=d.cd*cdMul; pt.lunge=1;
    const a2=leadAim(pt.x,pt.y-PET_SIZE*0.3,t,520); pt.face=a2; pt.aimAngle=a2;
    if(G.projs.length>=PROJ_CAP) G.projs.shift();
    if(d.kind==='gun'){
      AudioMgr.play('rifle',.3*allyGunSfxMul(owner));
      const hp=gunHandPos(pt,PET_SIZE,a2), mz=gunMuzzle('wolfgun',hp.hx,hp.hy,a2,petGunScale);
      G.projs.push({x:mz.mx,y:mz.my,vx:Math.cos(a2)*520,vy:Math.sin(a2)*520,dmg,r:2,c:d.c,pierce:1,aoe:0,life:1.4,maxLife:1.4,hs:new Set(),
        bulletImg:'bullet',dispLen:gunRenderLen('wolfgun',petGunScale)*0.7,crit:owner.st.crit,cdmg:owner.st.cdmg});
    } else {
      G.projs.push({x:pt.x,y:pt.y,vx:Math.cos(a2)*480,vy:Math.sin(a2)*480,dmg,r:2,c:d.c,pierce:1,aoe:0,life:1.4,maxLife:1.4,hs:new Set(),crit:owner.st.crit,cdmg:owner.st.cdmg});
    }
  });
}

/* ---------------------- AI 아군 ---------------------- */
function autoLevelAlly(a){
  a.st.atk=1+0.05*(G.wave-1);
  a.st.aspd=1+0.03*(G.wave-1);
  a.st.crit=Math.min(.4,.05+0.01*(G.wave-1));
  a.maxHp=90*(1+0.08*(G.wave-1)); if(a.hp>a.maxHp) a.hp=a.maxHp;
  a.speed=188+Math.min(40,G.wave);
  a.weapons[0].lv=Math.min(8,1+Math.floor(G.wave/4));
}
/* AI 아군 행동 설정 — 난이도와 무관하게 항상 이 값을 쓴다(똑똑함은 고정, 난이도는 몬스터만 조절) */
const AI_CFG={ idealFrac:0.7, tooClose:0.6, tooFar:1.2, tether:352, lowHpFrac:0.35, bossIdealMul:1.3, surroundN:3, surroundR:82, separateR:44 };
const MIN_GAP=BASE_SIZE*0.95, SEP_FORCE=240;
/* 아군끼리 · 아군과 플레이어가 겹치지 않게 실제 위치를 직접 밀어낸다(목표점만 비트는 것으론 부족함) */
function applySeparation(a,dt){
  for(const o of [G.player,...G.allies]){
    if(o===a||o.eliminated||o.down>0) continue;
    const dx=a.x-o.x, dy=a.y-o.y, d=Math.hypot(dx,dy);
    if(d>0 && d<MIN_GAP){
      const push=(MIN_GAP-d)/MIN_GAP;
      a.x=clamp(a.x+(dx/d)*push*SEP_FORCE*dt,20,WORLD-20);
      a.y=clamp(a.y+(dy/d)*push*SEP_FORCE*dt,20,WORLD-20);
    }
  }
}
function updateAlly(a,dt){
  if(a.eliminated) return;
  if(a.down>0){ updateMemberDown(a,dt); return; }
  if(a.aiJitter==null){ a.aiJitter=rnd(0.85,1.18); a.aiTurnRate=rnd(7,11); } // 개체마다 반응속도·유지거리를 살짝 다르게 — 전원이 똑같이 움직이면 복제처럼 보인다
  const T=G.tower, anchor=T||WORLD_CENTER;
  const w=a.weapons[0], wd=WEAPONS[w.id];
  const range=(wd.range&&wd.range<9000)?wd.range:260;
  const searchR=Math.max(range*1.6,420);
  const isGuard=a.role==='guard' && !!T; // 역할이 guard여도 타워가 없으면(무한모드) 그냥 solo처럼 움직인다

  /* 화면(플레이어 카메라) 밖까지 혼자 돌아다니므로 아군 타겟팅은 화면 여부와 무관하게(anyScreen=true) 잡는다 */
  let target=nearest(a.x,a.y,searchR,null,true);
  if(isGuard){
    /* 코어 지키기 — 코어에 가장 가까이 접근한 몹을 우선 처리한다 */
    let bestTd=BASE_SIZE*9, towerThreat=null;
    for(const m of G.mobs){ if(m.dead)continue; const td=dist(m,T); if(td<bestTd){ bestTd=td; towerThreat=m; } }
    if(towerThreat) target=towerThreat;
  }

  let goal=null, strafe=false;
  if(target){
    const idealMul=target.boss?AI_CFG.bossIdealMul:1;
    const ideal=range*AI_CFG.idealFrac*idealMul*a.aiJitter;
    const d0=dist(a,target);
    if(d0<ideal*AI_CFG.tooClose){ const ang=Math.atan2(a.y-target.y,a.x-target.x); goal={x:a.x+Math.cos(ang)*70,y:a.y+Math.sin(ang)*70}; }
    else if(d0>ideal*AI_CFG.tooFar){ goal={x:target.x,y:target.y}; }
    else strafe=true;
  } else if(isGuard){
    /* 위협이 없으면 코어 주위를 슬롯 각도대로 천천히 순찰 — 서로 겹치지 않는다 */
    const R=BASE_SIZE*3.2;
    const ang=(a.slotAng||0)+performance.now()*0.00022;
    goal={x:T.x+Math.cos(ang)*R, y:T.y+Math.sin(ang)*R*0.7};
  } else {
    /* 개인 플레이 — 플레이어를 따라다니는 게 아니라 자기만의 사냥 구역(슬롯 각도 기준)을 맡는다.
       2.4~4.2초마다 목표를 새로 잡아 한 자리에 굳지 않고, 몹이 몰린 곳을 발견하면 그쪽을 우선한다 */
    if(!a.huntT || a.huntT<=0){
      a.huntT=2.4+Math.random()*1.8;
      const baseAng=(a.slotAng||0)+(Math.random()-0.5)*0.9;
      const hd=BASE_SIZE*(5+Math.random()*4);
      a.huntX=clamp(G.player.x+Math.cos(baseAng)*hd,60,WORLD-60);
      a.huntY=clamp(G.player.y+Math.sin(baseAng)*hd,60,WORLD-60);
    }
    a.huntT-=dt;
    const cluster=densestCluster(a.x,a.y,BASE_SIZE*7);
    goal = cluster ? {x:cluster.x,y:cluster.y} : {x:a.huntX,y:a.huntY};
  }

  /* 포위당하면 위협이 적은 반대쪽으로 */
  const near=G.mobs.filter(m=>!m.dead && dist(a,m)<AI_CFG.surroundR);
  if(near.length>=AI_CFG.surroundN){
    let sx=0,sy=0; for(const m of near){ sx+=m.x-a.x; sy+=m.y-a.y; }
    const ang=Math.atan2(sy,sx)+Math.PI;
    goal={x:a.x+Math.cos(ang)*90,y:a.y+Math.sin(ang)*90}; strafe=false;
  }

  /* 체력이 낮으면 크게 후퇴 + 요정 보유 아군 근처로 */
  if(a.hp<a.maxHp*AI_CFG.lowHpFrac){
    let healer=anchor;
    const withFairy=G.allies.find(m=>m!==a && !m.eliminated && hasFairy(m));
    if(withFairy) healer=withFairy;
    const ang=Math.atan2(healer.y-a.y,healer.x-a.x);
    goal={x:a.x+Math.cos(ang)*130,y:a.y+Math.sin(ang)*130}; strafe=false;
  }

  /* 위협이 없으면 근처 경험치·상자를 주우러 간다 (역할 공통) */
  if(!target){
    const box=G.boxes.find(b=>!b.got && dist(a,b)<320);
    if(box) goal={x:box.x,y:box.y};
    else{ const orb=G.orbs.find(o=>!o.got && dist(a,o)<139); if(orb) goal={x:orb.x,y:orb.y}; }
  }

  if(isGuard){
    /* 코어 지키기: 목적지가 코어에서 너무 멀어지지 않게 당긴다. 지키는 역할이므로 쫓아가지 않는다 */
    if(goal){
      const gd=dist(goal,T);
      const tetherR=Math.min(AI_CFG.tether,BASE_SIZE*10);
      if(gd>tetherR){ const ang=Math.atan2(goal.y-T.y,goal.x-T.x); goal={x:T.x+Math.cos(ang)*tetherR,y:T.y+Math.sin(ang)*tetherR}; }
    }
    /* 코어 체력이 깎이고 있으면 복귀 우선 */
    if(T._lastHp!=null && T.hp<T._lastHp-0.01 && dist(a,T)>240){
      goal={x:T.x+(a.formOff?a.formOff.x*0.5:0),y:T.y+(a.formOff?a.formOff.y*0.5:0)}; strafe=false;
    }
  } else {
    /* 개인 플레이: 플레이어와 너무 멀어지면 돌아온다 — 화면 밖에서 혼자 죽는 걸 막는다 */
    const pd=dist(a,G.player);
    if(pd>BASE_SIZE*14){
      const ang=Math.atan2(G.player.y-a.y,G.player.x-a.x);
      goal={x:a.x+Math.cos(ang)*140,y:a.y+Math.sin(ang)*140}; strafe=false;
    }
  }

  /* 아군끼리 뭉치지 않게 분산 */
  for(const other of G.allies){
    if(other===a||other.eliminated) continue;
    const dd=dist(a,other);
    if(dd<AI_CFG.separateR && dd>0.01){
      const ang=Math.atan2(a.y-other.y,a.x-other.x);
      goal=goal||{x:a.x,y:a.y}; goal={x:goal.x+Math.cos(ang)*30,y:goal.y+Math.sin(ang)*30};
    }
  }

  let vx=0,vy=0;
  if(strafe && target){
    a.strafeDir=a.strafeDir||pick([1,-1]);
    const ang=Math.atan2(target.y-a.y,target.x-a.x)+Math.PI/2*a.strafeDir;
    vx=Math.cos(ang)*a.speed*0.55; vy=Math.sin(ang)*a.speed*0.55;
    a.x=clamp(a.x+vx*dt,20,WORLD-20); a.y=clamp(a.y+vy*dt,20,WORLD-20);
    a.face=turnTo(a.face,Math.atan2(target.y-a.y,target.x-a.x),a.aiTurnRate,dt);
  } else if(goal){
    const ang=Math.atan2(goal.y-a.y,goal.x-a.x), dd=Math.hypot(goal.x-a.x,goal.y-a.y);
    if(dd>12){ vx=Math.cos(ang)*a.speed; vy=Math.sin(ang)*a.speed; a.x=clamp(a.x+vx*dt,20,WORLD-20); a.y=clamp(a.y+vy*dt,20,WORLD-20); a.face=turnTo(a.face,ang,a.aiTurnRate,dt); }
    else if(target) a.face=turnTo(a.face,Math.atan2(target.y-a.y,target.x-a.x),4.5,dt);
  } else if(target) a.face=turnTo(a.face,Math.atan2(target.y-a.y,target.x-a.x),4.5,dt);

  applySeparation(a,dt); // 아군끼리·플레이어와 겹치지 않게 실제 위치를 밀어냄
  resolveObstacles(a, BASE_SIZE*0.28);

  a.moving=Math.hypot(vx,vy)>4?1:0;
  const mo=motionCalc(a,dt,vx,vy,a.speed,MOTION_CFG.hero,G.time);
  if(mo.footPlant) spawnDust(a.x,a.y+a.r*0.7,a.r);
  a._m=mo;
  a.inv=Math.max(0,a.inv-dt);
  if(a.st.regen) a.hp=Math.min(a.maxHp,a.hp+a.st.regen*dt);
  applyAutoRegen(a,dt);
  updateDispHp(a,dt);
  autoLevelAlly(a);
  updateMemberCombat(a,dt);
}

/* ---------------------- 업데이트 ---------------------- */
/* filter()는 매번 새 배열을 만든다. 초당 수백 개씩 쌓이면 iOS GC가 이를 청소하며 프레임을 끊는다.
   compact()는 같은 배열을 제자리에서 줄여 할당을 없앤다. */
function compact(arr,keep){
  let j=0;
  for(let i=0;i<arr.length;i++){ const v=arr[i]; if(keep(v)) arr[j++]=v; }
  arr.length=j;
}
const _mobAlive=m=>!m.dead, _alive=b=>b.life>0, _boltAlive=b=>b.t<b.life, _notGot=o=>!o.got;
const _fxAlive=f=>f.t<f.life, _faAlive=f=>f.t<f.duration, _gibAlive=g=>g.t<g.life, _dmgAlive=d=>d.t<d.life, _tPartAlive=p=>p.t<p.life;
function update(dt){
  const p=G.player, T=G.tower;
  G.time+=dt;
  updateNuke(dt);
  if(G.nukeFx){
    G.nukeFx.t+=dt;
    /* 첫 충격 뒤 짧은 강진과 약한 여진을 이어서 유지한다. */
    const nt=G.nukeFx.t;
    if(nt<0.20) shake=Math.max(shake,34);
    else if(nt<0.62) shake=Math.max(shake,20*(1-(nt-0.20)/0.42));
    else if(nt<1.10) shake=Math.max(shake,7*(1-(nt-0.62)/0.48));
    if(G.nukeFx.t>=G.nukeFx.life) G.nukeFx=null;
  }
  if(G.coreMoveMsg){ G.coreMoveMsg.t+=dt; if(G.coreMoveMsg.t>=G.coreMoveMsg.life) G.coreMoveMsg=null; }
  updateWave(dt);
  buildMobGrid(); // 이 프레임의 nearest/areaDmg/투사체충돌/펫탐색이 전부 이 격자를 참조하므로 몹 이동/공격 로직보다 먼저 지어둔다

  /* 플레이어 */
  if(p.down>0){
    updateMemberDown(p,dt);
    p.moving=0;
  } else if(!p.eliminated) {
    const v=inputVec();
    const vx=v.x*p.speed, vy=v.y*p.speed;
    p.x=clamp(p.x+vx*dt,20,WORLD-20);
    p.y=clamp(p.y+vy*dt,20,WORLD-20);
    resolveObstacles(p, BASE_SIZE*0.28);
    const moving=!!(v.x||v.y);
    if(moving){ p.face=turnTo(p.face,Math.atan2(v.y,v.x),9,dt); p.moveAng=Math.atan2(v.y,v.x); }
    else{
      const t=nearest(p.x,p.y,328);
      if(t) p.face=turnTo(p.face,Math.atan2(t.y-p.y,t.x-p.x),4.5,dt);
    }
    p.moving=moving?1:0;
    const mo=motionCalc(p,dt,vx,vy,p.speed,MOTION_CFG.hero,G.time);
    if(mo.footPlant) spawnDust(p.x,p.y+p.r*0.7,p.r);
    p._m=mo;
    if(p.st.regen) p.hp=Math.min(p.maxHp,p.hp+p.st.regen*dt);
    p.inv=Math.max(0,p.inv-dt);
    updateMemberCombat(p,dt);
  }

  applyAutoRegen(p,dt);
  updateDispHp(p,dt);

  /* AI 아군 */
  for(const a of G.allies) updateAlly(a,dt);

  /* 펫 (플레이어 + 아군 각자) */
  updatePetsFor(p,p.pets,dt);
  for(const a of G.allies){ if(!a.eliminated) updatePetsFor(a,a.pets,dt); }

  /* 몬스터 */
  const members=livingMembers(); // 몹 루프 밖에서 한 번만 — 안에 있으면 몹 수만큼 배열을 새로 만들어 GC 부담이 커진다
  for(const m of G.mobs){
    if(m.dead)continue;
    m.hit=Math.max(0,m.hit-dt);
    m.slowT=Math.max(0,(m.slowT||0)-dt); // 크림슨 팽에 닿아있는 동안만 느려짐 — 매 프레임 아주 짧게(0.15초) 갱신되고 안 닿으면 금방 풀린다
    let nearestMember=null, ndist=Infinity;
    for(const e of members){ const dd=dist(m,e); if(dd<ndist){ndist=dd; nearestMember=e;} }
    const toT=T?dist(m,T):Infinity;
    if(!m.tp && ndist<119) m.tp=true;
    else if(m.tp && ndist>189) m.tp=false;
    if(!nearestMember) m.tp=false;
    const tgt = (m.tp && nearestMember) ? nearestMember : (T||nearestMember);
    if(!tgt){ continue; }
    let sp=m.sp*(m.slowT>0?CRIMSON_SLOW_MUL:1);
    const a=Math.atan2(tgt.y-m.y,tgt.x-m.x); m.ang=a;
    const stopAt=m.ranged?126:((tgt.r||34)+m.r-4);
    const dd=tgt===T?toT:ndist;
    if(m.shape==='hunter'){
      m.chargeT=(m.chargeT||0)-dt;
      if(m.chargeT<=-2.2 && dd<420){ m.chargeT=0.5; }            // 예비동작 시작
      if(m.chargeT>0) sp=0;                                       // 멈춰서 노려봄
      else if(m.chargeT>-0.45) sp=m.sp*2.6;                        // 돌진
    }
    const px=m.x, py=m.y;
    let vx=0,vy=0;
    if(dd>stopAt){
      vx=Math.cos(a)*sp; vy=Math.sin(a)*sp;
      const bx=m.x, by=m.y;
      m.x+=vx*dt; m.y+=vy*dt;
      resolveObstacles(m, m.r*0.8);
      const moved=Math.hypot(m.x-bx, m.y-by);
      if(moved<Math.hypot(vx,vy)*dt*0.35){ // 거의 못 움직였다 = 막혔다 → 진행방향의 수직으로 미끄러짐
        const side=(m._slide||1);
        m.x+=(-vy)*side*dt*0.9; m.y+=(vx)*side*dt*0.9;
        if(Math.random()<0.02) m._slide=-side; // 가끔 방향 전환 (구석 탈출)
        resolveObstacles(m, m.r*0.8);
      }
    }
    if(m.kx||m.ky){
      m.x+=m.kx*dt; m.y+=m.ky*dt;
      const damp=Math.pow(0.02,dt);
      m.kx*=damp; m.ky*=damp;
      if(Math.abs(m.kx)<2&&Math.abs(m.ky)<2){ m.kx=0; m.ky=0; }
      resolveObstacles(m, m.r*0.8);
    }
    m.vx=vx+(m.kx||0); m.vy=vy+(m.ky||0); // 예측 조준(leadAim)용 — 실제 이번 프레임 이동속도(넉백 포함)
    if(Math.hypot(m.x-px,m.y-py)>sp*dt*0.5) m.face=turnTo(m.face,Math.atan2(m.y-py,m.x-px),4.2,dt);
    m._mt=(m._mt||0)+dt*(MOB_MOTION[m.shape]?MOB_MOTION[m.shape].rate:8)*(dd>stopAt?1:0.5);
    { // 박쥐처럼 공중에 뜨는 몬스터는 뜬 높이만큼 판정도 같이 올라가야 한다
      const cf=MOB_MOTION[m.shape];
      if(cf && cf.fly){
        const fly=m.size*(cf.fly+Math.sin(m._mt*0.42)*0.06);
        m.hy=m.size*(MOBS[m.t].hitY??0)-fly;
      }
    }
    m.atkT-=dt;
    if(m.atkT<=0 && dd<=stopAt+8){
      m.atkT=m.ranged?1.5:0.85;
      if(m.ranged){
        if(G.eprojs.length>=EPROJ_CAP) G.eprojs.shift();
        G.eprojs.push({x:m.x,y:m.y,vx:Math.cos(a)*176,vy:Math.sin(a)*176,dmg:m.dmg,r:3,life:2.4});
      } else if(tgt===T){ damageTower(m.dmg); }
      else { damageMember(tgt,m.dmg); }
    }
  }
  compact(G.mobs,_mobAlive);
  buildMobGrid(); // 몬스터 이동 후 현재 위치로 다시 인덱싱 — 총알이 이전 셀을 보고 몸을 통과하는 현상 방지

  /* 아군 투사체 */
  for(const b of G.projs){
    if(b.delay>0){ b.delay-=dt; continue; }
    if(b.fxProj) b.anim=(b.anim||0)+dt*22;
    if(b.trail){ // 고정 길이 링버퍼 — 매프레임 객체생성+unshift(배열 전체 밀기) 없이 슬롯만 덮어쓴다
      b.trailHead=(b.trailHead+1)%6;
      const slot=b.trail[b.trailHead]; slot.x=b.x; slot.y=b.y;
      if(b.trailLen<6) b.trailLen++;
    }
    if(b.homing && !b.homing.dead){
      const a=Math.atan2((b.homing.y+(b.homing.hy||0))-b.y,b.homing.x-b.x), cs=Math.hypot(b.vx,b.vy);
      const ca=Math.atan2(b.vy,b.vx), na=ca+clamp(Math.atan2(Math.sin(a-ca),Math.cos(a-ca)),-4*dt,4*dt);
      b.vx=Math.cos(na)*cs; b.vy=Math.sin(na)*cs;
    } else if(b.homing && b.homing.dead){ b.homing=nearest(b.x,b.y,202); }
    const px=b.x, py=b.y;
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    const cx=(px+b.x)*0.5, cy=(py+b.y)*0.5;
    const qr=Math.hypot(b.x-px,b.y-py)*0.5+b.r+_mobGridReach;
    const cand=queryMobs(cx,cy,qr,_qProj);
    _qProjHits.length=0;
    for(let i=0;i<cand.length;i++){
      const m=cand[i];
      if(m.dead||b.hs.has(m))continue;
      const hitT=segCircleHitT(px,py,b.x,b.y,m.x,m.y+(m.hy||0),m.r+b.r+BASE_SIZE*0.10);
      if(hitT!==null) _qProjHits.push({m,t:hitT});
    }
    /* 같은 프레임에 여러 몸을 가로질러도 진행방향의 앞 몬스터부터 맞힌다. */
    if(_qProjHits.length>1) _qProjHits.sort((a,b)=>a.t-b.t);
    for(const hit of _qProjHits){
      const m=hit.m; if(m.dead||b.hs.has(m)) continue;
      b.hs.add(m);
      const ix=px+(b.x-px)*hit.t, iy=py+(b.y-py)*hit.t;
      if(b.aoe){
        b.x=ix; b.y=iy;
        areaDmg(ix,iy,b.aoe,b.dmg,b.c,b.crit,b.cdmg); AudioMgr.play('explosion');
        addFx({k:'flash',x:ix,y:iy,r0:5,r1:b.aoe*0.8,c:'#fff',life:.3});
        shake=Math.max(shake,7);
        b.life=0; break;
      }
      hurt(m,b.dmg,b.crit,b.cdmg); b.pierce--;
      if(b.pierce<=0){ b.x=ix; b.y=iy; b.life=0; break; }
    }
  }
  compact(G.projs,_alive);

  const members2=livingMembers();
  for(const b of G.eprojs){
    const epx=b.x, epy=b.y;
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    let hitAny=false;
    for(const e of members2){ if(segHitsCircle(epx,epy,b.x,b.y,e.x,e.y,e.r+b.r)){ damageMember(e,b.dmg); hitAny=true; break; } }
    if(!hitAny && T && segHitsCircle(epx,epy,b.x,b.y,T.x,T.y,T.r+b.r)){ damageTower(b.dmg); hitAny=true; }
    if(hitAny) b.life=0;
  }
  compact(G.eprojs,_alive);

  /* 체인 라이트닝 시각효과 수명 */
  for(const b of G.bolts) b.t+=dt;
  compact(G.bolts,_boltAlive);

  /* 경험치 오브 */
  for(const o of G.orbs){
    o.t+=dt;
    const d=Math.hypot(p.x-o.x,p.y-o.y);
    if(o.magnet){
      const dx=p.x-o.x, dy=p.y-o.y, L=Math.hypot(dx,dy)||1;
      o.x+=dx/L*o.speed*dt; o.y+=dy/L*o.speed*dt;
    } else if(d<p.st.pickup){
      const a=Math.atan2(p.y-o.y,p.x-o.x), sp=180+ (p.st.pickup-d)*3.2;
      o.x+=Math.cos(a)*sp*dt; o.y+=Math.sin(a)*sp*dt;
    }
    if(d<p.r+8 || (o.magnet && d<20)){ o.got=1; gainXp(o.v); AudioMgr.play('xpPick',.5); }
  }
  compact(G.orbs,_notGot);

  /* 히든 상자 — 등장 빈도 낮춤 */
  G.boxT-=dt;
  if(G.boxT<=0){ G.boxT=rnd(48,72);
    const a=Math.random()*Math.PI*2, d=rnd(126,328);
    spawnBox(clamp(p.x+Math.cos(a)*d,60,WORLD-60), clamp(p.y+Math.sin(a)*d,60,WORLD-60));
  }
  for(const b of G.boxes){
    b.t+=dt;
    if(b.got) continue;
    { const dx=p.x-b.x,dy=p.y-b.y,rr=p.r+b.r+6;
    if(dx*dx+dy*dy<rr*rr){
      b.got=1; addFx({k:'ring',x:b.x,y:b.y,r0:3,r1:49,c:'#ffd166',life:.5}); AudioMgr.play('box');
      openChoice('히든 상자','HIDDEN BOX',true);
      continue;
    } }
    // AI 아군도 히든 상자를 먹고 성장한다 — UI 없이 즉시 자동 적용
    for(const a of G.allies){
      if(a.eliminated||a.down>0) continue;
      const dx=a.x-b.x,dy=a.y-b.y,rr=a.r+b.r+6;
      if(dx*dx+dy*dy<rr*rr){
        b.got=1; addFx({k:'ring',x:b.x,y:b.y,r0:3,r1:49,c:'#ffd166',life:.5}); AudioMgr.play('box',.6);
        autoResolveChoice(a,true);
        break;
      }
    }
  }
  compact(G.boxes,_notGot);

  /* 이펙트 */
  for(const f of G.fx){ f.t+=dt; }
  compact(G.fx,_fxAlive);
  for(const f of G.fxAnim){ f.t+=dt; }
  compact(G.fxAnim,_faAlive);
  /* 데미지 숫자 — 튀어올랐다 떨어진다. delay가 남아있으면 그 자리에서 대기(핵폭탄처럼 한꺼번에 뜰 때 안 겹치게) */
  for(const d of G.dmgTxt){
    if(d.delay>0){ d.delay-=dt; continue; }
    d.t+=dt;
    d.x+=d.vx*dt; d.y+=d.vy*dt;
    d.vy+=BASE_SIZE*3.4*dt;
    d.vx*=Math.pow(0.25,dt);
  }
  compact(G.dmgTxt,_dmgAlive);
  /* 블러드 토네이도 — 솟구치는 입자 + 시전 화면 번쩍임 */
  updateTornadoParticles(dt);
  if(G.flash){ G.flash.t+=dt; if(G.flash.t>=G.flash.life) G.flash=null; }
  /* 사망 파편 — 중력 + 공기저항 */
  for(const g of G.gibs){
    g.t+=dt;
    g.vy+=BASE_SIZE*9*dt;
    g.x+=g.vx*dt; g.y+=g.vy*dt;
    g.rot+=g.vr*dt;
    g.vx*=Math.pow(0.12,dt);
  }
  compact(G.gibs,_gibAlive);
  shake=Math.max(0,shake-dt*38);
  if(G.tower) G.tower._lastHp=G.tower.hp; // 다음 프레임 AI가 "타워 피해 중" 여부를 판단하는 기준
}

/* ---------------------- 렌더 ---------------------- */
let cam={x:0,y:0};
/* 모바일 최적화: 카메라 밖은 그리지 않는다 */
function inView(x,y,margin){
  margin=margin||60;
  return x>cam.x-margin && x<cam.x+W+margin && y>cam.y-margin && y<cam.y+H+margin;
}
function drawMemberGun(e){
  if(!e.activeGun || e.gunAngle==null) return;
  if(e.activeGun==='revolver'){
    const l=revolverHandPos(e,BASE_SIZE,-1), r=revolverHandPos(e,BASE_SIZE,1);
    drawGunSprite('revolver',l.hx,l.hy,e.gunAngle);
    drawGunSprite('revolver',r.hx,r.hy,e.gunAngle);
    return;
  }
  const hp=gunHandPos(e,BASE_SIZE,e.gunAngle);
  drawGunSprite(e.activeGun,hp.hx,hp.hy,e.gunAngle);
}
/* 손잡이를 (hx,hy)에 고정하고 base+rel 각도로 회전시켜 그린다 — 잔상·본체가 공유하는 저수준 그리기 */
function drawKatanaAt(e,w,base,rel){
  const I=KATANA_IMG[w.id]; if(!I||!I.ready) return;
  const info=KATANA_INFO[w.id];
  const target=base+rel; // 실제로 칼날이 향해야 하는 절대각(베는 기준각 + 스윙 진행에 따른 상대각)
  const hp=katanaHandPos(e,BASE_SIZE,base);
  const targetW=BASE_SIZE*(KATANA_SCALE[w.id]||0.62);
  const sc=targetW/I.img.width;
  const iw=I.img.width*sc, ih=I.img.height*sc;
  const bladeRad=info.bladeAng*Math.PI/180;
  ctx.save();
  ctx.translate(hp.hx,hp.hy);
  /* 총과 동일한 검증된 공식: 왼쪽 반원(cosθ<0)이면 회전 먼저 → 반전, 오른쪽이면 그냥 회전 */
  if(Math.cos(base)<0){ ctx.rotate(target-Math.PI+bladeRad); ctx.scale(-1,1); }
  else ctx.rotate(target-bladeRad);
  ctx.drawImage(I.img,-iw*info.pivotX,-ih*info.pivotY,iw,ih);
  ctx.restore();
}
function drawMemberKatana(e){
  const w=e.weapons&&e.weapons.find(x=>WEAPONS[x.id]&&WEAPONS[x.id].kind==='katana');
  if(!w) return;
  const cur=w.swinging?currentKatanaPose(w):null;
  let base,rel;
  if(cur){ base=cur.ang; rel=katanaSwingAngle(cur.t); }
  else {
    base=isFinite(e.aimAngle)?e.aimAngle:Math.PI;
    rel=K_REST;
  }
  /* 잔상 — 내려침 구간에서만, 궤적이 읽히도록 본체 아래에 흐리게 깐다 */
  if(cur && cur.t>=SW_UP && cur.t<SW_UP+SW_HIT){
    for(let i=1;i<=3;i++){
      const back=cur.t-i*0.014;
      if(back<SW_UP) break;
      ctx.globalAlpha=(0.26/i)*fxOpacity;
      drawKatanaAt(e,w,base,katanaSwingAngle(back));
    }
    ctx.globalAlpha=1;
  }
  drawKatanaAt(e,w,base,rel);
  if(w.tornado) drawBloodTornado(e,w);
}
/* 이동 방향 표시 — 플레이어 본인만. 캐릭터 중심 원형으로 8방향 화살표를 두고, 진행 방향에 가까운 것만 밝힌다 */
/* 이동 방향 표시 — 8방향 고정 대신 입력 방향 그대로 부드럽게 따라오는 화살표 1개 */
function drawDirArrow(e){
  if(!e.isPlayer || !e.moving || e.moveAng==null) return;
  const a=e.moveAng;
  const RX=BASE_SIZE*1.05, RY=BASE_SIZE*0.72;
  const sz=BASE_SIZE*0.22;
  const cy=e.y-BASE_SIZE*0.42;
  let ax=e.x+Math.cos(a)*RX;
  let ay=cy+Math.sin(a)*RY;
  if(Math.sin(a)<-0.25) ay-=BASE_SIZE*0.34; // 위로 갈 때 체력바에 가리지 않도록 추가로 띄운다
  ctx.save();
  ctx.translate(ax,ay);
  ctx.rotate(a);
  ctx.globalAlpha=0.92;
  ctx.fillStyle='#bff2ff';
  ctx.strokeStyle='rgba(10,20,40,.55)'; ctx.lineWidth=sz*0.22;
  ctx.beginPath();
  ctx.moveTo(sz,0);
  ctx.lineTo(-sz*0.55,sz*0.72);
  ctx.lineTo(-sz*0.20,0);
  ctx.lineTo(-sz*0.55,-sz*0.72);
  ctx.closePath();
  ctx.stroke(); ctx.fill();
  ctx.restore();
  ctx.globalAlpha=1;
}
function drawMember(e){
  if(e.eliminated) return;
  if(e.down>0){
    ctx.globalAlpha=.4; ctx.fillStyle='#6ee7ff';
    ctx.beginPath(); ctx.ellipse(e.x,e.y,16,8,0,0,7); ctx.fill(); ctx.globalAlpha=1;
    ctx.fillStyle='#fff'; ctx.font='700 12px system-ui'; ctx.textAlign='center';
    ctx.fillText('부활 '+Math.ceil(e.down),e.x,e.y-22);
    return;
  }
  drawDirArrow(e);
  if(e.inv>0 && Math.floor(e.inv*16)%2) ctx.globalAlpha=.45;
  const mw=e.weapons&&e.weapons.find(x=>WEAPONS[x.id]&&WEAPONS[x.id].kind==='katana');
  const pose=(mw&&mw.swinging)?currentKatanaPose(mw):null;
  const overhead=!!(pose && pose.t<SW_UP); // 들어올릴 때는 캐릭터 뒤에, 내려친 뒤엔 앞에 보인다
  const bodyOff=pose?katanaBodyOffset(pose.t):null;
  const bodyAng=pose?pose.ang:(isFinite(e.aimAngle)?e.aimAngle:e.face);
  const bx=bodyOff?e.x+Math.cos(bodyAng)*BASE_SIZE*bodyOff.push:e.x;
  const by=bodyOff?e.y+Math.sin(bodyAng)*BASE_SIZE*bodyOff.push:e.y;
  if(overhead) drawMemberKatana(e);
  const r=drawHero(e.char,bx,by,e.face,BASE_SIZE,{motion:e._m});
  e.drawX=r?r.drawX:bx; e.drawY=r?r.drawY:by;
  drawMemberGun(e);
  if(!overhead) drawMemberKatana(e);
  ctx.globalAlpha=1;
  drawHpBar(e,e.isPlayer?'#5ff0c0':'#5fa8ff');
  drawFeetShield(e);
}
/* 까마귀 펫의 방어막 — 캐릭터 발밑에 표시 */
function drawFeetShield(e){
  if(!e.shieldMax) return;
  const w=BASE_SIZE*0.8, h=3.5;
  const y=(e.drawY??e.y)+6, x=(e.drawX??e.x)-w/2;
  const pct=clamp(e.shield/e.shieldMax,0,1);
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle= e.shield>0 ? '#b39bff' : 'rgba(160,140,220,.35)';
  ctx.fillRect(x,y,w*(e.shield>0?pct:1),h);
  if(e.shield<=0){
    const regenPct=1-clamp((e.shieldRegenT??0)/10,0,1);
    ctx.fillStyle='#7dffc0'; ctx.fillRect(x,y,w*regenPct,1.5);
  }
}
/* 머리 위 체력바 — 항상 표시, 바운스를 그대로 따라감. 깎인 만큼 하얗게 잠깐 남았다 사라짐
   그 바로 아래에 게이지형 총(샷건·레일건)의 충전 게이지를 표시한다(라이플·기관총 등은 표시 안 함) */
const HP_BAR_H=5, GAUGE_BAR_H=3.5, BAR_GAP=1.5;
function drawHpBar(e,color){
  const w=BASE_SIZE*0.95;
  const topY=(e.drawY??e.y)-BASE_SIZE-9;
  const x=(e.drawX??e.x)-w/2;
  const pct=clamp(e.hp/e.maxHp,0,1), dispPct=clamp((e.dispHp??e.hp)/e.maxHp,0,1);
  const full=pct>=0.999 && dispPct>=0.999;
  ctx.globalAlpha=full?0.32:1;
  ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(x,topY,w,HP_BAR_H);
  if(dispPct>pct+0.002){ ctx.fillStyle='#ffffff'; ctx.fillRect(x,topY,w*dispPct,HP_BAR_H); }
  ctx.fillStyle=color; ctx.fillRect(x,topY,w*pct,HP_BAR_H);
  ctx.globalAlpha=1;

  const gaugeWeapons=e.weapons.filter(gw=>WEAPONS[gw.id].gauge);
  gaugeWeapons.forEach((gw,i)=>{
    const gy=topY+HP_BAR_H+BAR_GAP+i*(GAUGE_BAR_H+BAR_GAP);
    const full2=gw.gauge>=1;
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(x,gy,w,GAUGE_BAR_H);
    ctx.fillStyle=full2?'#ffe89a':'#8b6bff';
    ctx.fillRect(x,gy,w*clamp(gw.gauge||0,0,1),GAUGE_BAR_H);
    if(full2){ ctx.globalAlpha=0.5+0.5*Math.sin(G.time*10); ctx.fillStyle='#fff'; ctx.fillRect(x,gy,w,GAUGE_BAR_H); ctx.globalAlpha=1; }
  });
}
const _petBuf=[]; // 매 프레임 [...스프레드] 로 새 배열 만드는 대신 재사용
function draw(dt){
  ctx.fillStyle='#0d0b16'; ctx.fillRect(0,0,W,H);
  if(!G) return;
  const p=G.player,T=G.tower;
  cam.x=clamp(p.x-W/2,0,Math.max(0,WORLD-W));
  cam.y=clamp(p.y-H/2,0,Math.max(0,WORLD-H));
  const sx=shake?rnd(-shake,shake):0, sy=shake?rnd(-shake,shake):0;
  ctx.save(); ctx.translate(-cam.x+sx,-cam.y+sy);

  if(DEBUG_NOMAP){
    ctx.fillStyle='#1a1630'; ctx.fillRect(cam.x,cam.y,W,H); // 맵 배경 완전 스킵, 단색으로만 대체 (A/B 테스트용)
  } else if(mapBaked){
    ctx.globalAlpha=.88;
    ctx.drawImage(mapBaked, cam.x,cam.y,W,H, cam.x,cam.y,W,H); // 1:1 — 매프레임 축소/타일반복 없음
    ctx.globalAlpha=1;
  } else {
    const gs=80, x0=Math.floor(cam.x/gs)*gs, y0=Math.floor(cam.y/gs)*gs;
    ctx.strokeStyle='rgba(120,95,215,.10)'; ctx.lineWidth=1; ctx.beginPath();
    for(let x=x0;x<cam.x+W+gs;x+=gs){ctx.moveTo(x,cam.y);ctx.lineTo(x,cam.y+H);}
    for(let y=y0;y<cam.y+H+gs;y+=gs){ctx.moveTo(cam.x,y);ctx.lineTo(cam.x+W,y);}
    ctx.stroke();
  }
  ctx.strokeStyle='rgba(180,120,255,.25)'; ctx.lineWidth=3;
  ctx.strokeRect(0,0,WORLD,WORLD);

  drawWDust(dt||0);

  if(G.nextT){
    ctx.save(); ctx.setLineDash([10,8]); ctx.strokeStyle='rgba(255,190,90,.75)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(G.nextT.x,G.nextT.y,42+Math.sin(G.time*4)*4,0,7); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle='rgba(255,200,110,.95)'; ctx.font='700 13px system-ui';
    ctx.textAlign='center'; ctx.fillText('다음 코어 위치',G.nextT.x,G.nextT.y-56); ctx.restore();
  }

  for(const o of G.orbs){
    if(!inView(o.x,o.y,20)) continue;
    const sz=o.size||5;
    ctx.fillStyle=(o.glow||'#bfe0ff')+'55'; ctx.beginPath(); ctx.arc(o.x,o.y,sz*1.8,0,7); ctx.fill(); // 값싼 광채(shadowBlur 대체)
    ctx.fillStyle=o.c||'#5fa8ff'; ctx.beginPath(); ctx.arc(o.x,o.y,sz,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(o.x-sz*0.28,o.y-sz*0.28,sz*0.34,0,7); ctx.fill();
  }

  for(const b of G.boxes){
    if(!inView(b.x,b.y,40)) continue;
    const s=1+Math.sin(b.t*5)*.09; // 기존 바운스(커졌다 작아졌다) 그대로 유지
    const glowPulse=0.6+0.4*Math.sin(b.t*6.2);
    ctx.save(); ctx.translate(b.x,b.y); ctx.scale(s,s);
    const rg=ctx.createRadialGradient(0,0,6,0,0,48);
    rg.addColorStop(0,'rgba(255,224,150,'+(0.6*glowPulse)+')');
    rg.addColorStop(1,'rgba(255,224,150,0)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(0,0,48,0,TAU); ctx.fill(); // 잘 보이게 — 기존보다 크고 밝은 광채
    if(HIDDENBOX_IMG.ready) ctx.drawImage(HIDDENBOX_IMG,-24,-24,48,48); // 전체 1.5배 확대 요청 (기존 32→48)
    else { ctx.fillStyle='#ffd166'; ctx.fillRect(-21,-16.5,42,33); ctx.fillStyle='#8a5a12'; ctx.fillRect(-21,-4.5,42,7.5); }
    // 반짝임(십자 글린트) — 서로 다른 위상으로 2개
    for(let gi=0;gi<2;gi++){
      const ga=(b.t*3.4+gi*2.4)%(Math.PI*2);
      const gp=Math.max(0,Math.sin(ga));
      if(gp<=0.02) continue;
      const gx=gi===0?-13.5:15, gy=gi===0?-18:13.5, gsz=5.25*gp;
      ctx.save(); ctx.globalAlpha=gp; ctx.strokeStyle='#fff8dc'; ctx.lineWidth=1.3;
      ctx.beginPath();
      ctx.moveTo(gx-gsz,gy); ctx.lineTo(gx+gsz,gy);
      ctx.moveTo(gx,gy-gsz); ctx.lineTo(gx,gy+gsz);
      ctx.stroke(); ctx.restore();
    }
    ctx.restore();
  }

  if(T) drawTower(T);
  for(const m of G.mobs){ if(inView(m.x,m.y,m.size||60)) drawMob(m); }

  ctx.fillStyle='#ff8fa8';
  for(const b of G.eprojs){ if(!inView(b.x,b.y,30))continue; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); }

  _petBuf.length=0;
  for(const q of G.player.pets) _petBuf.push(q);
  for(const a of G.allies){ if(!a.eliminated) for(const q of a.pets) _petBuf.push(q); }
  for(const pt of _petBuf){
    const lungeAng=pt.face??0, lungeD=(pt.lunge||0)*PET_SIZE*0.35; // 공격 시 앞으로 살짝 튀어나감
    const lx=pt.x+Math.cos(lungeAng)*lungeD, ly=pt.y+Math.sin(lungeAng)*lungeD;
    const r=drawPet(pt.k,lx,ly,pt.face??Math.PI/2,PET_SIZE,pt._m);
    pt.drawX=r.drawX; pt.drawY=r.drawY;
    if(pt.k==='wolf' && pt.aimAngle!=null){ const hp=gunHandPos(pt,PET_SIZE,pt.aimAngle); drawGunSprite('wolfgun',hp.hx,hp.hy,pt.aimAngle,petGunScale); }
  }

  for(const a of G.allies) drawMember(a);
  drawMember(p);
  drawTornadoParticles();

  for(const b of G.projs){ if(b.delay>0)continue;
    if(!inView(b.x,b.y,60)) continue;
    const ang=Math.atan2(b.vy,b.vx);
    // 투사체 종류에 관계없이 같은 페이드를 적용 — 수명의 마지막 20%에서 서서히 투명해진다
    ctx.save();
    ctx.globalAlpha=projAlpha(b);
    if(b.bulletImg==='bullet'||b.bulletImg==='minigunBullet'){
      drawProjTrail(b,b.dispLen||14);
      if(b.bulletImg==='bullet') drawStaticBullet(BULLET_IMG,b.x,b.y,ang,b.dispLen);
      else drawStaticBullet(MINIGUN_BULLET,b.x,b.y,ang,b.dispLen,268/836);
    }
    else if(b.fxProj){
      drawProjTrail(b,b.dispSize||23);
      drawEffectFrame(FX_SHEETS[b.fxProj],Math.floor(b.anim||0),b.x,b.y,b.dispSize||23,b.dispSize||23,ang-(b.fxFront||0));
    }
    else { ctx.fillStyle=b.c+'44'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r*1.8,0,7); ctx.fill();
      ctx.fillStyle=b.c; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); }
    ctx.restore();
  }

  drawBolts();
  ctx.globalAlpha=fxOpacity;
  drawFxAnims();
  drawSpinnerOrbs();
  ctx.globalAlpha=1;

  for(const f of G.fx){ if(inView(f.x,f.y,120)) drawFx(f); }
  drawGibs();
  drawNukeBoom();
  drawDmgTexts(); // 핵폭발의 흰 섬광·연기보다 위에 그려 핵 피해 숫자가 확실히 보이게 한다
  ctx.restore();
  drawNukeWarn();
  drawCoreMoveMsg();
  drawTornadoFlash();

  drawStick();
}
/* 체인 라이트닝: 스프라이트 시트를 쓰지 않고 매 프레임 조금씩 흔들리는 지그재그 선으로 그린다 */
function boltPath(b,jitterPhase){
  const dx=b.x1-b.x0, dy=b.y1-b.y0, L=Math.hypot(dx,dy)||1;
  const nx=-dy/L, ny=dx/L;
  const seg=Math.max(5,Math.round(L/16));
  const amp=Math.min(16,L*0.11); // 진폭을 줄여야 실제 사거리보다 넓어 보이지 않는다
  const pts=[{x:b.x0,y:b.y0}];
  for(let i=1;i<seg;i++){
    const t=i/seg;
    const r=Math.sin(b.seed+i*2.7+jitterPhase*11.0);
    const off=r*amp*Math.sin(Math.PI*t);
    pts.push({x:b.x0+dx*t+nx*off,y:b.y0+dy*t+ny*off});
  }
  pts.push({x:b.x1,y:b.y1});
  return pts;
}
function drawBolts(){
  for(const b of G.bolts){
    const k=b.t/b.life;
    const a=(k<0.18?1:1-(k-0.18)/0.82)*fxOpacity;
    if(a<=0) continue;
    const pts=boltPath(b,b.t);
    ctx.save();
    ctx.lineCap='round'; ctx.lineJoin='round';
    const layers=[
      {w:b.w*2.8,c:'rgba(90,170,255,'+(0.20*a)+')'},
      {w:b.w*1.7,c:'rgba(120,212,255,'+(0.70*a)+')'},
      {w:b.w*0.7,c:'rgba(255,255,255,'+(0.95*a)+')'},
    ];
    for(const L of layers){
      ctx.strokeStyle=L.c; ctx.lineWidth=L.w;
      ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
      ctx.stroke();
    }
    for(let i=2;i<pts.length-1;i+=3){
      const p=pts[i], q=pts[i+1];
      const bx=p.x+(q.x-p.x)*0.5, by=p.y+(q.y-p.y)*0.5;
      const ang=Math.atan2(q.y-p.y,q.x-p.x)+(Math.sin(b.seed+i)*0.9);
      const len=b.w*(1.8+Math.abs(Math.sin(b.seed+i*3))*2.4);
      ctx.strokeStyle='rgba(160,225,255,'+(0.5*a)+')'; ctx.lineWidth=b.w*0.55;
      ctx.beginPath(); ctx.moveTo(bx,by);
      ctx.lineTo(bx+Math.cos(ang)*len,by+Math.sin(ang)*len); ctx.stroke();
    }
    ctx.fillStyle='rgba(200,240,255,'+(0.55*a)+')';
    ctx.beginPath(); ctx.arc(b.x1,b.y1,b.w*(1.3+k*1.5),0,TAU); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,'+(0.85*a)+')';
    ctx.beginPath(); ctx.arc(b.x1,b.y1,b.w*0.9,0,TAU); ctx.fill();
    ctx.restore();
  }
}
function drawFxAnims(){
  for(const f of G.fxAnim){
    if(!f.sheet||!f.sheet.ready) continue;
    if(!inView(f.x,f.y,120)) continue;
    const k=f.t/f.duration, fi=Math.min(f.sheet.frames-1,Math.floor(k*f.sheet.frames));
    if(f.beam){ drawBeam(f.sheet,fi,f.x,f.y,f.angle,f.len,f.thick); continue; }
    if(f.anchored){
      const col=fi%f.sheet.cols, row=Math.floor(fi/f.sheet.cols);
      const cw=f.sheet.cell[0]*f.scale, ch=f.sheet.cell[1]*f.scale;
      ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.angle);
      ctx.drawImage(f.sheet.img, col*f.sheet.cell[0], row*f.sheet.cell[1], f.sheet.cell[0], f.sheet.cell[1],
        -f.ax*f.scale, -f.ay*f.scale, cw, ch);
      ctx.restore();
      continue;
    }
    const cw=f.sheet.cell[0]*f.scale, ch=f.sheet.cell[1]*f.scale;
    drawEffectFrame(f.sheet,fi,f.x+Math.cos(f.angle)*cw*0.28,f.y+Math.sin(f.angle)*ch*0.28,cw,ch,f.angle);
  }
}
function drawSpinnerOrbs(){
  for(const e of [G.player,...G.allies]){
    if(e.eliminated) continue;
    for(const w of e.weapons){
      const d=WEAPONS[w.id];
      if(d.kind!=='orbit'||!w.orbs) continue;
      const sheet=FX_SHEETS[d.fxSheet2];
      for(const orb of w.orbs){
        const s=(orb.sz||spinnerSize(w.orbs.length))*SPINNER_VISUAL_MUL;
        /* 회전 방향 뒤쪽에만 아주 옅은 동일 색상 프레임을 겹쳐 붉은/푸른 잔상을 만든다. */
        if(orb.ang!=null&&orb.orbitR){
          const baseAlpha=ctx.globalAlpha;
          ctx.save();
          ctx.globalCompositeOperation='lighter';
          for(let j=3;j>=1;j--){
            const ta=orb.ang-(orb.orbitSpd||1.8)*0.032*j;
            const tx=e.x+Math.cos(ta)*orb.orbitR, ty=e.y+Math.sin(ta)*orb.orbitR;
            ctx.globalAlpha=baseAlpha*(j===1?0.10:j===2?0.06:0.03);
            drawEffectFrame(sheet,Math.floor(orb.anim-j*0.7),tx,ty,s*(1-j*0.025),s*(1-j*0.025),0);
          }
          ctx.restore();
        }
        drawEffectFrame(sheet,Math.floor(orb.anim),orb.x,orb.y,s,s,0);
      }
    }
  }
}
/* 지킴 대상 이미지 — 기존엔 절차적 원이었는데, 유랑/수호/무한 전 모드 공통으로 "타워"를 코어(gif)로 교체 */
const CORE_IMG=loadImg(P_UI('core2.png')); // 일반 이미지로 교체 (기존 코어.gif 대체) — 배경 제거(플러드필) 처리됨
const HIDDENBOX_IMG=loadImg(P_UI('hidden_box.png'));
function drawTower(T){
  const f=T.hp/T.maxHp;
  const size=(T.r+16*SIZE_MUL)*2; // 기존 절차적 원(외곽 광채 T.r+16까지)과 같은 시각 크기를 유지, SIZE_MUL로 함께 확대
  ctx.save(); ctx.translate(T.x,T.y);
  // 은은한 하늘색 발광 — 이미지 자체 애니메이션이 작게 보일 때도 확실히 빛나 보이게 덧대는 펄스 광채
  const pulse=0.55+0.45*Math.sin(G.time*2.2);
  const rg=ctx.createRadialGradient(0,0,size*0.12,0,0,size*0.62);
  rg.addColorStop(0,'rgba(140,220,255,'+(0.30*pulse)+')');
  rg.addColorStop(1,'rgba(140,220,255,0)');
  ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(0,0,size*0.62,0,TAU); ctx.fill();
  if(CORE_IMG.ready) ctx.drawImage(CORE_IMG,-size/2,-size/2,size,size);
  if(T.shield>0){
    ctx.strokeStyle='rgba(120,200,255,'+(0.35+0.3*Math.sin(G.time*5))+')'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,size/2+11,0,TAU); ctx.stroke();
  }
  ctx.restore();
  bar(T.x-38,T.y-size/2-16,76,6,f,'#ffb347');
}
/* 이미지의 알파를 그대로 유지한 채 지정 색으로 채운 캔버스 — 피격 플래시/엘리트 틴트용.
   source-atop을 메인 캔버스가 아니라 이 오프스크린 캔버스 안에서만 쓰므로 사각형으로 번지지 않는다 */
function makeSilhouette(src,color){
  const c=document.createElement('canvas');
  c.width=src.width; c.height=src.height;
  const g=c.getContext('2d');
  g.drawImage(src,0,0);
  g.globalCompositeOperation='source-in';
  g.fillStyle=color||'#ffffff';
  g.fillRect(0,0,c.width,c.height);
  return c;
}
/* ================= 몬스터 이미지 로더 (캐릭터와 동일 방식: trimToCanvas → prescale로 미리 구워둔다) ================= */
const MOB_KO={crawler:'crawler',hunter:'hunter',golemite:'golemite',stinger:'stinger',tyrant:'tyrant'};
const MOB_IMG={};
for(const k in MOB_KO){
  const o={img:null,ready:false}; MOB_IMG[k]=o;
  const im=new Image();
  im.onload=()=>{
    const bakeH=Math.ceil(BASE_SIZE*(MOBS[k]?MOBS[k].sizeScale:1)*1.2*(Math.min(3,devicePixelRatio||1)+0.5));
    o.img=prescale(trimToCanvas(im),bakeH);
    o.lit=makeSilhouette(o.img,'#ffffff');
    o.ready=true;
  };
  im.onerror=()=>console.error('몬스터 이미지 로드 실패:',MOB_KO[k]);
  im.src='assets/mobs/'+MOB_KO[k]+'.png';
}
/* 몬스터별 움직임 — 살아있는 느낌 */
const MOB_MOTION={
  crawler :{rate:11.0, bounce:.075, squash:.10, sway:.07},              // 총총총
  hunter  :{rate:8.5,  bounce:.060, squash:.13, sway:.12},              // 게처럼 흔들
  golemite:{rate:4.2,  bounce:.042, squash:.07, sway:.04},              // 쿵, 쿵
  stinger :{rate:13.0, bounce:.000, squash:.06, sway:.14, fly:.34},
  tyrant  :{rate:2.3,  squashPair:true, bounce:.05, sway:.015},          // 젤리처럼 가로세로 반대로 출렁
};
function drawMob(m){
  const I=MOB_IMG[m.shape]; if(!I||!I.ready) return;
  const cf=MOB_MOTION[m.shape]||MOB_MOTION.crawler;
  const t=(m._mt=(m._mt||0));
  const s=m.size;
  let bounce, sqx=1, sqy;
  if(cf.squashPair){                                  // 보스 슬라임 — 가로/세로가 반대로 출렁여야 젤리처럼 보인다
    const p=Math.sin(t*1.15);
    sqx=1+p*0.16; sqy=1-p*0.16;
    bounce=Math.max(0,Math.sin(t*1.15))*s*cf.bounce;
  } else {
    bounce=Math.abs(Math.sin(t))*s*cf.bounce;
    sqy=1-Math.abs(Math.sin(t))*cf.squash;
  }
  const sway=Math.sin(t*0.5)*cf.sway;
  const fly=cf.fly? s*(cf.fly+Math.sin(t*0.42)*0.06) : 0;   // 공중 높이
  /* 그림자 — 박쥐(비행)만. 기어다니는 몬스터는 그림자 없음 */
  if(cf.fly>0){
    const k=1-(fly/s-cf.fly)*0.6;
    ctx.fillStyle='rgba(0,0,0,'+(0.26*k)+')';
    ctx.beginPath(); ctx.ellipse(m.x,m.y,s*0.26*k,s*0.10*k,0,0,TAU); ctx.fill();
  }
  const mirror=Math.cos(m.face)<0?1:-1;
  const shk=m.hit>0?Math.sin(m.hit*160)*s*0.07*(m.hit/.12):0; // 맞았을 때 짧게 부르르 떠는 흔들림
  ctx.save();
  ctx.translate(m.x+shk, m.y-bounce-fly);
  ctx.scale(mirror*sqx,sqy);
  ctx.rotate(sway);
  const h=s*(m.shape==='stinger'?0.78:0.92);
  const w=h*(I.img.width/I.img.height);
  ctx.drawImage(I.img,-w/2,-h,w,h);
  if(m.hit>0){                                       // 피격 플래시 — 몬스터 모양 그대로 하얗게
    ctx.globalAlpha=Math.min(.9,m.hit*4);
    ctx.drawImage(I.lit,-w/2,-h,w,h);
    ctx.globalAlpha=1;
  }
  ctx.restore();
  const barY=m.y-s*1.05-8-fly;
  if(m.hp<m.maxHp) bar(m.x-m.r,barY,m.r*2,3,m.hp/m.maxHp,m.boss?'#ff4d6d':'#ff8fa8');
  if(m.boss){ ctx.fillStyle='#ff9eb0'; ctx.font='800 11px system-ui'; ctx.textAlign='center';
    ctx.fillText(MOBS[m.t].n,m.x,barY-8); }
}

/* 펫별 움직임 — 몬스터와 같은 방식(위상 누적 + bounce/squash/sway). 까마귀·요정은 공중에 뜬다 */
const PET_MOTION={
  golem:{rate:4.5,bounce:.05,squash:.07,sway:.03},
  crow :{rate:12.0,bounce:.00,squash:.05,sway:.10,fly:.22},
  wolf :{rate:9.5,bounce:.07,squash:.09,sway:.06},
  fairy:{rate:10.0,bounce:.00,squash:.04,sway:.08,fly:.28},
};
/* ================= 펫 이미지 로더 — 캐릭터·몬스터와 완전히 동일한 방식 ================= */
const PET_KO={golem:'golem', crow:'crow', wolf:'wolf', fairy:'fairy'};
const PET_IMG={};
for(const k in PET_KO){
  const o={img:null,ready:false}; PET_IMG[k]=o;
  const im=new Image();
  im.onload=()=>{
    const bakeH=Math.ceil(PET_SIZE*1.2*(Math.min(3,devicePixelRatio||1)+0.5));
    o.img=prescale(trimToCanvas(im),bakeH); o.ready=true;
  };
  im.onerror=()=>console.error('펫 이미지 로드 실패:',PET_KO[k]);
  im.src='assets/pets/'+PET_KO[k]+'.png';
}
/* 원본은 전부 왼쪽을 보고 있다 — 캐릭터와 동일 규칙(cos(face)<0 이면 그대로, 아니면 미러).
   펫은 바닥에 붙어 다니므로 그림자를 유지한다. */
function drawPet(k,x,groundY,face,size,motion){
  const I=PET_IMG[k];
  const P=motion||{bounce:0,squashY:1,squashX:1,sway:0};
  ctx.fillStyle='rgba(0,0,0,.16)';
  ctx.beginPath(); ctx.ellipse(x,groundY,size*0.30,size*0.12,0,0,TAU); ctx.fill();
  if(!I||!I.ready) return {drawX:x,drawY:groundY};
  const mirror=Math.cos(face)<0?1:-1;
  const gy=groundY-(P.bounce||0);
  ctx.save();
  ctx.translate(x,gy);
  ctx.scale(mirror*(P.squashX||1),(P.squashY||1));
  ctx.rotate(P.sway||0);
  const h=size, w=h*(I.img.width/I.img.height);
  ctx.drawImage(I.img,-w/2,-h,w,h);
  ctx.restore();
  return {drawX:x, drawY:gy};
}

function bar(x,y,w,h,f,c){
  ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=c; ctx.fillRect(x,y,w*clamp(f,0,1),h);
}
function drawFx(f){
  const k=f.t/f.life, a=(1-k)*fxOpacity;
  ctx.globalAlpha=a;
  if(f.k==='txt'){
    ctx.font=`800 ${f.size}px system-ui`; ctx.textAlign='center';
    const ty=f.y+(f.vy||-40)*k*0.6;
    if(f.crit){
      ctx.lineWidth=Math.max(3,f.size*0.17); ctx.strokeStyle='rgba(60,20,0,.8)';
      ctx.strokeText(f.txt,f.x,ty);
    }
    ctx.fillStyle=f.c; ctx.fillText(f.txt,f.x,ty);
  } else if(f.k==='ring'){
    ctx.strokeStyle=f.c; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r0+(f.r1-f.r0)*k,0,7); ctx.stroke();
  } else if(f.k==='line'){
    ctx.strokeStyle=f.c; ctx.lineWidth=f.wd||3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(f.x2,f.y2); ctx.stroke();
  } else if(f.k==='arc'){
    const h=f.half||1.05;
    ctx.strokeStyle=f.c; ctx.lineWidth=8*(1-k*.5);
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(0.55+k*0.45),f.a-h,f.a+h); ctx.stroke();
  } else if(f.k==='burst'){
    ctx.fillStyle=f.c;
    for(let i=0;i<f.n;i++){ const a2=i/f.n*7, r=14+k*46;
      ctx.beginPath(); ctx.arc(f.x+Math.cos(a2)*r,f.y+Math.sin(a2)*r,3*(1-k),0,7); ctx.fill(); }
  } else if(f.k==='dust'){
    ctx.fillStyle='rgba(220,210,255,'+(0.35*a)+')';
    ctx.beginPath(); ctx.ellipse(f.x,f.y,(3+k*7)*(f.r?f.r/12:1),(1.6+k*3)*(f.r?f.r/12:1),0,0,7); ctx.fill();
  } else if(f.k==='flash'){
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=f.c; ctx.globalAlpha=a*0.8;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r0+(f.r1-f.r0)*k,0,7); ctx.fill();
    ctx.globalCompositeOperation='source-over';
  } else if(f.k==='blood'){
    if(f._seed==null){ f._seed=[]; for(let i=0;i<f.n;i++) f._seed.push({a:Math.random()*7,sp:.7+Math.random()*1.0,sz:.7+Math.random()*1.1}); }
    ctx.fillStyle='#c41a22';
    const rBase=f.r||14;
    const burstK=Math.min(1,k*3.2); // 죽는 순간 확 튀는 느낌 — 초반에 빠르게 퍼졌다가 서서히 떨어짐
    for(let i=0;i<f.n;i++){
      const s=f._seed[i];
      const dd=rBase*3.0*s.sp*burstK;
      const fall=k*k*rBase*2.0;
      const sz2=(1-k*0.25);
      ctx.beginPath(); ctx.ellipse(f.x+Math.cos(s.a)*dd, f.y+Math.sin(s.a)*dd*0.55+fall, 3.6*s.sz*sz2,2.8*s.sz*sz2,0,0,7); ctx.fill();
    }
    ctx.fillStyle='#8a0f16';
    ctx.beginPath(); ctx.ellipse(f.x,f.y+rBase*0.3,rBase*0.95,rBase*0.42,0,0,7); ctx.fill();
  } else if(f.k==='shard'){
    ctx.fillStyle=f.c;
    const rBase=f.r||14;
    for(let i=0;i<f.n;i++){
      if(f._seed==null) f._seed=Math.random()*7;
      const a2=(i/f.n)*7+f._seed;
      const dd=14+k*(rBase*3.6);
      ctx.save();
      ctx.translate(f.x+Math.cos(a2)*dd, f.y+Math.sin(a2)*dd-k*rBase*0.7);
      ctx.rotate(a2*4+k*10);
      const s=Math.max(.25,1-k)*(rBase*0.20+3);
      ctx.fillRect(-s*0.5,-s*0.35,s,s*0.7);
      ctx.restore();
    }
  } else if(f.k==='slashMark'){ // 블러드 토네이도 타격 순간 튀는 칼자국
    ctx.save();
    ctx.globalAlpha=a;
    ctx.translate(f.x,f.y); ctx.rotate(f.ang);
    ctx.strokeStyle='rgba(255,70,95,0.95)'; ctx.lineCap='round';
    ctx.lineWidth=BASE_SIZE*0.055*(1-k*0.5);
    ctx.beginPath(); ctx.moveTo(-f.len*0.5,0); ctx.lineTo(f.len*0.5,0); ctx.stroke();
    ctx.strokeStyle='rgba(255,220,225,0.8)';
    ctx.lineWidth=BASE_SIZE*0.02;
    ctx.beginPath(); ctx.moveTo(-f.len*0.35,0); ctx.lineTo(f.len*0.35,0); ctx.stroke();
    ctx.restore();
  } else if(f.k==='bloodRing'){ // 블러드 토네이도 종료 충격파
    const r=f.r0+(f.r1-f.r0)*(1-Math.pow(1-k,2)); // 처음 빠르게, 나중 느리게
    ctx.save();
    ctx.globalAlpha=a;
    ctx.translate(f.x,f.y); ctx.scale(1,0.78);
    ctx.strokeStyle='rgba(255,50,80,0.9)';
    ctx.lineWidth=BASE_SIZE*0.14*a;
    ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.stroke();
    ctx.strokeStyle='rgba(255,210,215,0.8)';
    ctx.lineWidth=BASE_SIZE*0.05*a;
    ctx.beginPath(); ctx.arc(0,0,r*0.93,0,TAU); ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawStick(){
  if(!stick.on)return;
  const vx=stick.x-stick.ox, vy=stick.y-stick.oy, l=Math.hypot(vx,vy), m=Math.min(62,l);
  const a=Math.atan2(vy,vx);
  ctx.strokeStyle='rgba(180,160,255,.28)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(stick.ox,stick.oy,62,0,7); ctx.stroke();
  ctx.fillStyle='rgba(180,160,255,.45)';
  ctx.beginPath(); ctx.arc(stick.ox+Math.cos(a)*m,stick.oy+Math.sin(a)*m,24,0,7); ctx.fill();
}

const mmCv=$('mm'), mmCtx=mmCv.getContext('2d');
function drawMinimap(){
  mmCtx.clearRect(0,0,112,112);
  mmCtx.fillStyle='rgba(18,14,32,.5)'; mmCtx.fillRect(0,0,112,112);
  const s=100/WORLD, off=6;
  if(G.tower){ mmCtx.fillStyle='#ffb347'; mmCtx.beginPath(); mmCtx.arc(off+G.tower.x*s,off+G.tower.y*s,4,0,7); mmCtx.fill(); }
  mmCtx.fillStyle='#ff6b8a';
  for(const m of G.mobs){ if(m.dead) continue; mmCtx.fillRect(off+m.x*s-1,off+m.y*s-1,2,2); }
  mmCtx.fillStyle='#7ee8ff';
  for(const a of G.allies){ if(a.eliminated) continue; mmCtx.beginPath(); mmCtx.arc(off+a.x*s,off+a.y*s,2.6,0,7); mmCtx.fill(); }
  mmCtx.fillStyle='#fff';
  mmCtx.beginPath(); mmCtx.arc(off+G.player.x*s,off+G.player.y*s,3,0,7); mmCtx.fill();
}

let _hudAcc=1; // 체력바 등 가벼운 갱신은 매 프레임, 무거운 DOM 재구성(로드아웃/미니맵/팀리스트)은 10Hz로 스로틀링 — 모바일 랙 완화
/* 값이 안 바뀌었으면 DOM을 건드리지 않는다 — 사파리에서 textContent 대입은 값이 같아도 레이아웃 재계산을 유발할 수 있다 */
const _el={}, _last={};
function setTxt(id,v){
  const e=_el[id]||(_el[id]=document.getElementById(id));
  if(_last[id]===v) return;
  _last[id]=v; if(e) e.textContent=v;
}
function hud(dt){
  if(!G)return;
  const T=G.tower;
  { const ts=Math.floor(G.time), mm=String(Math.floor(ts/60)).padStart(2,'0'), ss=String(ts%60).padStart(2,'0'); setTxt('timeChip',mm+':'+ss); }
  if(T){
    $('towerBar').style.display='';
    $('towerFill').style.width=(T.hp/T.maxHp*100)+'%';
    setTxt('towerTxt',`코어 ${Math.ceil(T.hp)}/${T.maxHp}`+(T.shield>0?`  🛡${Math.ceil(T.shield)}`:''));
  } else { $('towerBar').style.display='none'; }
  $('xpFill').style.width=(G.xp/G.xpNeed*100)+'%';
  setTxt('xpTxt','Lv.'+G.level);

  _hudAcc+=dt||0;
  if(_hudAcc<0.1) return;
  _hudAcc=0;
  syncXpBarVar(); // 메뉴→플레이 전환 등으로 처음 보이게 됐을 때도 정확한 값이 잡히도록 주기적으로 재측정

  drawMinimap();

}
function drawTeamList(){
  if(!teamOpen) return; // 접혀있으면 DOM 갱신 자체를 건너뛴다 (성능에도 이득)
  const p=G.player;
  const rows=[{e:p,name:CHARACTERS[p.char].n,me:true},...G.allies.map(a=>({e:a,name:CHARACTERS[a.char].n,me:false}))];
  const html=rows.map(r=>{
    const e=r.e, down=e.down>0&&!e.eliminated;
    const pct=Math.max(0,Math.round(e.hp/e.maxHp*100));
    return `<div class="tm-row${r.me?' me':''}${down?' down':''}">
      <span class="tm-name">${r.me?'★ ':''}${r.name}</span>
      <span class="tm-bar"><i style="width:${down?100:pct}%"></i></span>
      ${down?`<span class="tm-down-t">${Math.ceil(e.down)}s</span>`:''}

  }).join('');
  if(_last.teamList!==html){ _last.teamList=html; $('teamList').innerHTML=html; }
}

let _fpsAcc=0,_fpsFrames=0,_fpsTimer=0,_fpsValue=0;
function updateFps(rawDt){
  _fpsFrames++; _fpsAcc+=rawDt;
  if(_fpsAcc>=0.5){ // 0.5초마다 갱신 — 매프레임 갱신하면 숫자가 튀어 읽기 어렵고 DOM비용도 늘어남
    const fps=Math.round(_fpsFrames/_fpsAcc);
    const flags=(DEBUG_NOMAP?' NOMAP':'')+(DEBUG_NOHUD?' NOHUD':'');
    _fpsValue=fps;
    _fpsAcc=0; _fpsFrames=0;
  }
}
function loop(t){
  const rawDt=(t-last)/1000||0; last=t;
  const dt=Math.min(.05,rawDt);
  if(state==='play'){ update(dt); if(!DEBUG_NOHUD) hud(dt); }
  draw(dt);
  updateFps(rawDt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(t=>{last=t;loop(t);});

    screens.querySelectorAll('#modeRow .mode').forEach(b=>b.classList.toggle('sel',b.dataset.m===SETUP.mode));
    screens.querySelectorAll('#sizeRow .sizebtn').forEach(b=>b.classList.toggle('sel',+b.dataset.s===SETUP.size));
  };
  paint();
  screens.querySelectorAll('#modeRow .mode').forEach(b=>btn(b,()=>{SETUP.mode=b.dataset.m; paint();}));
  screens.querySelectorAll('#sizeRow .sizebtn').forEach(b=>btn(b,()=>{SETUP.size=+b.dataset.s; paint();}));
  btn($('backBtn'),charWeaponScreen);
  btn($('startGameBtn'),()=>{
    initAudioCtx(); AC.resume(); loadSfxBuffers(); // iOS는 사용자 조작 없이 오디오를 시작할 수 없음 — 첫 게임 시작 버튼에서 한 번만
    newGame(SETUP.mode,SETUP.char,SETUP.gun,SETUP.size,SETUP.diff);
    screens.className=''; screens.innerHTML=''; setScreenBg(null);
    state='play'; last=performance.now();
    AudioMgr.playBgm('battle');
  });
}
function soundSettings(ret){
  if(ret==='mainhome'||ret==='menu') hideMainHome();
  const prevHtml=screens.innerHTML, prevBg=screens.style.backgroundImage;
  state='sound';
  screens.className='on'; setScreenBg(OVERLAY_BG);
  screens.innerHTML=`<div class="panel">
    <div class="eyebrow">SETTINGS</div><div class="title" style="font-size:26px">환경설정</div>
    <div class="slide"><label><span>효과음</span><span id="sfxV"></span></label><input type="range" id="sfxR" min="0" max="1" step="0.05"></div>
    <div class="slide"><label><span>배경음악</span><span id="bgmV"></span></label><input type="range" id="bgmR" min="0" max="1" step="0.05"></div>
    <div class="slide"><label><span>이펙트 투명도</span><span id="fxV"></span></label><input type="range" id="fxR" min="0" max="1" step="0.05"></div>
    <button class="btnmain" id="soundBack">확인</button></div>`;
  const sfxR=$('sfxR'), bgmR=$('bgmR'), fxR=$('fxR');
  sfxR.value=AudioMgr.getSfx(); bgmR.value=AudioMgr.getBgm(); fxR.value=fxOpacity;
  $('sfxV').textContent=Math.round(sfxR.value*100)+'%'; $('bgmV').textContent=Math.round(bgmR.value*100)+'%'; $('fxV').textContent=Math.round(fxR.value*100)+'%';
  sfxR.oninput=()=>{ AudioMgr.setSfx(+sfxR.value); $('sfxV').textContent=Math.round(sfxR.value*100)+'%'; };
  bgmR.oninput=()=>{ AudioMgr.setBgm(+bgmR.value); $('bgmV').textContent=Math.round(bgmR.value*100)+'%'; };
  fxR.oninput=()=>{ setFxOpacity(+fxR.value); $('fxV').textContent=Math.round(fxR.value*100)+'%'; };
  btn($('soundBack'),()=>{
    if(ret==='mainhome'||ret==='menu') mainScreen();
    else if(ret==='pause'){ screens.innerHTML=prevHtml; screens.style.backgroundImage=prevBg; state='pause'; wirePause(); }
  });
}
function inventoryScreen(){
  const prevHtml=screens.innerHTML;
  state='inventory';
  const rows=(list,active)=>list.map((pt,i)=>{
    const d=PETS[pt.k];
    return `<button class="petrow${active?' active':''}" data-i="${i}" data-a="${active?1:0}" style="color:#9dd6ff">
      <span>🐾 ${d.n} Lv.${pt.lv||1}</span><span>${active?'해제':'장착'}</span></button>`;
  }).join('') || '<div class="hint">없음</div>';
  screens.className='on';
  screens.innerHTML=`<div class="panel">
    <div class="eyebrow">INVENTORY</div><div class="title" style="font-size:24px">펫 인벤토리</div>
    <div class="petlist">
      <div class="pgroup"><b>장착 중 (최대 ${MAX_ACTIVE_PETS})</b>${rows(G.player.pets,true)}</div>
      <div class="pgroup" style="margin-top:12px"><b>보유 중</b>${rows(G.player.ownedPets,false)}</div>
    </div>
    <button class="btnmain" id="invBack">확인</button></div>`;
  screens.querySelectorAll('.petrow').forEach(b=>btn(b,()=>{
    const i=+b.dataset.i, isActive=+b.dataset.a===1;
    if(isActive){
      const [pt]=G.player.pets.splice(i,1); G.player.ownedPets.push(pt);
    } else {
      if(G.player.pets.length>=MAX_ACTIVE_PETS){ const [old]=G.player.pets.splice(0,1); G.player.ownedPets.push(old); }
      const [pt]=G.player.ownedPets.splice(i,1);
      pt.cd=0; pt.x=G.player.x; pt.y=G.player.y; G.player.pets.push(pt);
    }
    inventoryScreen();
  }));
  btn($('invBack'),()=>{ state='pause'; screens.innerHTML=prevHtml; wirePause(); });
}
function pauseWeaponRows(){
  const log=G.pickLog||{weapons:{},pets:{}};
  const weaponRows=G.player.weapons.map(w=>{
    const d=WEAPONS[w.id], taken=log.weapons[w.id]||0;
    const parts=[];
    if(d.kind==='katana'){
      parts.push((w.cuts??d.cuts)+'베기');
      if(w.id==='bloodkatana'&&w.tornadoLv) parts.push('토네이도 Lv.'+w.tornadoLv);
    } else parts.push('Lv.'+(w.lv||1));
    if(taken) parts.push('획득·강화 '+taken+'회');
    return `<div class="pause-row" style="color:${d.c}"><span>${d.ic} ${d.n}</span><b>${parts.join(' · ')}</b></div>`;
  });
  const allPets=[...G.player.pets,...G.player.ownedPets];
  const petRows=allPets.map(pt=>{
    const d=PETS[pt.k], taken=log.pets[pt.k]||0;
    return `<div class="pause-row" style="color:#9dd6ff"><span>🐾 ${d.n}</span><b>Lv.${pt.lv||1}${taken?' · '+taken+'회':''}</b></div>`;
  });
  return [...weaponRows,...petRows].join('')||'<div class="pause-empty">획득한 장비가 없습니다.</div>';
}
function pauseItemRows(){
  const log=G.pickLog||{total:0,items:{}};
  const items=log.items||{}, st=G.player.st;
  const featured=[
    ['공격력 강화','🗡 공격력','×'+st.atk.toFixed(2)],
    ['공격 속도 증가','⏱ 공격 속도','×'+st.aspd.toFixed(2)],
    ['치명타 확률','✧ 치명타 확률',Math.round(st.crit*100)+'%'],
    ['치명타 피해','✵ 치명타 피해','×'+st.cdmg.toFixed(2)],
  ];
  const rows=[`<div class="pause-row"><span>총 선택 횟수</span><b>${log.total||0}회</b></div>`];
  for(const [key,label,value] of featured) rows.push(`<div class="pause-row"><span>${label}</span><b>${value} · ${items[key]||0}회</b></div>`);
  const skip=new Set(featured.map(x=>x[0]));
  for(const [name,count] of Object.entries(items).filter(([name])=>!skip.has(name)).sort((a,b)=>b[1]-a[1])){
    const value=name==='핵폭탄'?`획득 ${count}회 · 보유 ${G.nukeCount||0}`:`${count}회`;
    rows.push(`<div class="pause-row"><span>${name}</span><b>${value}</b></div>`);
  }
  return rows.join('');
}
function wirePause(){
  btn($('res'),()=>{screens.className='';screens.innerHTML='';setScreenBg(null);state='play';last=performance.now();});
  btn($('quit'),()=>mainScreen());
  btn($('invBtn'),inventoryScreen);
  btn($('sndBtn'),()=>soundSettings('pause'));
}
function pause(){
  if(state!=='play')return;
  AudioMgr.play('btn');
  state='pause'; screens.className=''; screens.className='on'; setScreenBg(OVERLAY_BG);
  screens.innerHTML=`<div class="panel pause-panel">
    <div class="eyebrow">PAUSED</div><div class="title" style="font-size:28px">일시정지</div>
    <div class="pause-summary">
      <div><b>WAVE ${G.wave}</b><span>웨이브</span></div>
      <div><b>FPS ${_fpsValue||0}</b><span>프레임</span></div>
      <div><b>${G.kills}</b><span>몬스터 처치</span></div>
    </div>
    <div class="pause-grid">
      <section class="pause-box"><h3>획득 무기 · 펫</h3>${pauseWeaponRows()}</section>
      <section class="pause-box"><h3>획득 아이템 · 성장</h3>${pauseItemRows()}</section>
    </div>
    <button class="btnmain" id="res">계속하기</button>
    <button class="btnghost" id="invBtn">🐾 펫 인벤토리</button>
    <button class="btnghost" id="sndBtn">🔊 환경설정</button>
    <button class="btnghost" id="quit">포기하고 메인화면</button></div>`;
  wirePause();
}
$('pauseBtn').onclick=pause;
$('itemSlot').onclick=fireNuke;
let teamOpen=false;
$('teamToggle').onclick=()=>{
  teamOpen=!teamOpen;
  $('teamToggle').textContent=(teamOpen?'▲':'▼')+' 팀';
  $('teamList').classList.toggle('closed',!teamOpen);
  if(teamOpen){ _last.teamList=null; drawTeamList(); } // 펼치자마자 최신 상태로 즉시 갱신
};
$('teamList').classList.add('closed');
mainScreen();
</script>
</body>
</html>
